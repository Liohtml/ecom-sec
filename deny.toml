# cargo-deny: advisories, licenses, bans and crate sources.
# A RustSec vulnerability advisory fails the check unless it is listed
# under [advisories].ignore with a reason. See docs/CI.md.

[advisories]
yanked = "deny"
ignore = [
    # zip 2.4 only fixes these in 9.0.0. self-update never calls ZipArchive::extract
    # (or the stream extract API): it opens entries with by_index, rejects paths
    # without enclosed_name, and reads the ecomsec binary into memory.
    { id = "RUSTSEC-2026-0367", reason = "extract() wird nicht verwendet; SUID/SGID-Bits aus ZIP-Attributen werden nicht übernommen." },
    { id = "RUSTSEC-2026-0368", reason = "extract() wird nicht verwendet; es werden keine Symlinks aus dem Archiv angelegt." },
    { id = "RUSTSEC-2026-0369", reason = "extract() wird nicht verwendet; keine Rechtevergabe über Symlink-Ziele." },
    { id = "RUSTSEC-2026-0429", reason = "extract() wird nicht verwendet; die deklarierte Symlink-Größe wird nicht als Pufferkapazität benutzt." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    # Mozilla CA bundle shipped by webpki-roots (used by ureq and lettre).
    "CDLA-Permissive-2.0",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
