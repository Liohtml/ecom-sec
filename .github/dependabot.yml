version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  # Dockerfiles: repository root and docker/Dockerfile.release.
  # The Compose example tracks our own image and is not a base-image update.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "ghcr.io/liohtml/ecom-sec"

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
