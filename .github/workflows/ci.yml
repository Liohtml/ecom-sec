name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p ecomsec -- advisories lint advisories
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ecomsec-linux-x86_64
          path: target/release/ecomsec

  musl:
    # Same static build as the release pipeline, so release builds are known-good.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Smoke test (static binary)
        run: |
          file target/x86_64-unknown-linux-musl/release/ecomsec
          target/x86_64-unknown-linux-musl/release/ecomsec --version
          target/x86_64-unknown-linux-musl/release/ecomsec platforms
      - uses: actions/upload-artifact@v4
        with:
          name: ecomsec-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/ecomsec

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.sh
        run: |
          sh -n install.sh
          shellcheck -s sh install.sh
