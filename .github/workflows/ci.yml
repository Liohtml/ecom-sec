name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p ecomsec -- advisories lint advisories
      - name: Crates sind veröffentlichbar (ohne Upload)
        run: cargo package --workspace --locked --no-verify
      - run: cargo build --release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ecomsec-linux-x86_64
          path: target/release/ecomsec

  musl:
    # Same static build as the release pipeline, so release builds are known-good.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Smoke test (static binary)
        run: |
          file target/x86_64-unknown-linux-musl/release/ecomsec
          target/x86_64-unknown-linux-musl/release/ecomsec --version
          target/x86_64-unknown-linux-musl/release/ecomsec platforms
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ecomsec-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/ecomsec

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Lint install.sh
        run: |
          sh -n install.sh
          shellcheck -s sh install.sh scripts/install-minisign.sh scripts/check-minisign-pubkey.sh scripts/test-install-signature.sh
      - name: minisign-Public-Key ist konsistent
        run: sh scripts/check-minisign-pubkey.sh
      - name: install.sh prüft die Signatur
        run: sh scripts/test-install-signature.sh
      - name: Lint workflows (actionlint)
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint -color
