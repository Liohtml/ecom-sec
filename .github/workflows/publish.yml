name: crates.io

# Publishes all workspace crates to crates.io in dependency order.  Called by
# the Release workflow for every version tag (a release created with the
# workflow token does not trigger other workflows) or started by hand.
# Needs the secret
# CARGO_REGISTRY_TOKEN (crates.io API token with "publish-new" / "publish-update"),
# either as a repository secret or in a deployment environment (picked by the
# "environment" job below).

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag oder Commit, der veröffentlicht wird"
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false
      environment:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur packen und prüfen, nichts hochladen"
        type: boolean
        default: true
      environment:
        description: "GitHub-Environment mit dem Secret CARGO_REGISTRY_TOKEN (leer = automatisch)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Environment secrets are only visible to jobs that name the environment, and
  # the environment has to be fixed before such a job starts.  This job picks it:
  # input "environment" > repository variable CRATES_ENVIRONMENT > the only
  # user-created environment of the repository > "crates.io".
  environment:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      name: ${{ steps.pick.outputs.name }}
      all: ${{ steps.pick.outputs.all }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ENV: ${{ inputs.environment }}
          VAR_ENV: ${{ vars.CRATES_ENVIRONMENT }}
        run: |
          set -euo pipefail
          names="$(gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '.environments[].name' 2>/dev/null || true)"
          echo "Environments im Repository:"
          printf '%s\n' "$names" | sed '/^$/d; s/^/  - /'
          candidates="$(printf '%s\n' "$names" | grep -vxE 'crates\.io|github-pages|copilot|' || true)"
          if [ -n "$INPUT_ENV" ]; then
            name="$INPUT_ENV"; why="Eingabe"
          elif [ -n "$VAR_ENV" ]; then
            name="$VAR_ENV"; why="Variable CRATES_ENVIRONMENT"
          elif [ -n "$candidates" ] && [ "$(printf '%s\n' "$candidates" | wc -l)" -eq 1 ]; then
            name="$candidates"; why="einziges eigenes Environment"
          else
            name="crates.io"; why="Standard"
          fi
          echo "Verwendet: \"$name\" ($why)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "all=$(printf '%s\n' "$names" | sed '/^$/d' | paste -sd, -)" >> "$GITHUB_OUTPUT"

  publish:
    needs: environment
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Versionen müssen zum Tag passen
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          tag="${REF#refs/tags/}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Kein Versions-Tag ($REF) – Prüfung entfällt"; exit 0 ;;
          esac
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="ecomsec"))')"
          echo "Tag $tag · Cargo $version"
          [ "$tag" = "v$version" ] || { echo "Tag und Cargo-Version stimmen nicht überein"; exit 1; }

      - name: Packen und verifizieren
        run: cargo package --workspace --locked

      - name: Veröffentlichen
        if: inputs.dry_run == false
        env:
          # Accept the usual names for the crates.io token.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN || secrets.CRATES_TOKEN || secrets.CARGO_TOKEN }}
          ENVIRONMENT: ${{ needs.environment.outputs.name }}
          ALL_ENVIRONMENTS: ${{ needs.environment.outputs.all }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Kein crates.io-Token gefunden: weder als Repository-Secret noch im Environment \"$ENVIRONMENT\" (Secret-Name CARGO_REGISTRY_TOKEN). Vorhandene Environments: ${ALL_ENVIRONMENTS:-keine}. Den richtigen Namen beim Start ins Feld \"environment\" eintragen oder als Variable CRATES_ENVIRONMENT setzen."
            exit 1
          fi
          # Crates, deren Version schon auf crates.io liegt (z. B. nach einem
          # abgebrochenen Lauf), werden übersprungen. crates.io begrenzt das
          # Anlegen neuer Crates (429 mit "try again after <Zeit>"); dann wird
          # bis zu diesem Zeitpunkt gewartet und weitergemacht.
          packages="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; [print(p["name"], p["version"]) for p in json.load(sys.stdin)["packages"]]')"
          for attempt in $(seq 1 12); do
            exclude=()
            while read -r name version; do
              code="$(curl -s -o /dev/null -w '%{http_code}' -A "ecomsec-release (github.com/${GITHUB_REPOSITORY})" \
                "https://crates.io/api/v1/crates/${name}/${version}")"
              if [ "$code" = 200 ]; then
                exclude+=(--exclude "$name")
              fi
            done <<< "$packages"
            done_count=$(( ${#exclude[@]} / 2 ))
            total="$(printf '%s\n' "$packages" | wc -l)"
            echo "Bereits veröffentlicht: ${done_count}/${total}"
            if [ "$done_count" -eq "$total" ]; then
              echo "Alle Crates sind veröffentlicht."
              exit 0
            fi
            # cargo publiziert in Abhängigkeitsreihenfolge und wartet jeweils,
            # bis das Crate im Index verfügbar ist.
            if cargo publish --workspace --locked --no-verify "${exclude[@]}" 2>&1 | tee publish.log; then
              echo "Alle übrigen Crates sind veröffentlicht."
              exit 0
            fi
            retry="$(grep -o 'try again after [^.]*GMT' publish.log | head -1 | sed 's/try again after //' || true)"
            if [ -z "$retry" ]; then
              echo "::error::cargo publish ist fehlgeschlagen (kein Rate-Limit)."
              exit 1
            fi
            wait=$(( $(date -d "$retry" +%s) - $(date +%s) + 10 ))
            [ "$wait" -lt 10 ] && wait=10
            echo "::notice::crates.io-Rate-Limit für neue Crates – warte ${wait}s bis ${retry} (Versuch ${attempt})."
            sleep "$wait"
          done
          echo "::error::Nach 12 Versuchen noch nicht alle Crates veröffentlicht."
          exit 1
