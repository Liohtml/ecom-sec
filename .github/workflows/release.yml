name: Release

# Builds static/release binaries for all supported platforms when a version
# tag (v*) is pushed, attaches them with SHA256SUMS to a GitHub Release,
# publishes the container image to GHCR and the crates to crates.io
# (publish.yml, needs CARGO_REGISTRY_TOKEN).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag (z. B. v0.1.0), für den das Release (erneut) gebaut wird"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag being released: from the push or from the manual input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  deny:
    name: cargo-deny
    uses: ./.github/workflows/deny.yml

  build:
    name: Build ${{ matrix.target }}
    needs: deny
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            builder: musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            builder: zigbuild
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            builder: cargo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.builder == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        run: pip3 install cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.builder }}" = "zigbuild" ]; then
            cargo zigbuild --release --locked -p ecomsec --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p ecomsec --target "${{ matrix.target }}"
          fi

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          name="ecomsec-${TAG}-${TARGET}"
          exe="ecomsec"
          case "$TARGET" in *windows*) exe="ecomsec.exe" ;; esac
          bin="target/${TARGET}/release/${exe}"
          # The release profile already strips symbols; strip again with the
          # host tool where it can handle the target format.
          case "$TARGET" in
            x86_64-unknown-linux-musl) strip "$bin" ;;
            *apple-darwin) strip -x "$bin" ;;
          esac
          mkdir -p "dist/${name}"
          cp "$bin" README.md LICENSE "dist/${name}/"
          cd dist
          case "$TARGET" in
            *windows*) 7z a -tzip "${name}.zip" "${name}" > /dev/null; echo "asset=${name}.zip" >> "$GITHUB_OUTPUT" ;;
            *) tar czf "${name}.tar.gz" "${name}"; echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT" ;;
          esac
          rm -rf "${name}"
          ls -l

      - name: Smoke test
        # Only where the binary runs natively on the runner.
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/ecomsec"
          [ -f "${exe}.exe" ] && exe="${exe}.exe"
          "$exe" --version
          "$exe" platforms

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ecomsec-* > SHA256SUMS
          cat SHA256SUMS

      - name: minisign installieren
        run: sh scripts/install-minisign.sh "${RUNNER_TEMP}/bin"

      - name: SHA256SUMS signieren
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if grep -q PLACEHOLDER distrib/minisign.pub; then
            echo "::error::distrib/minisign.pub ist noch der Platzhalter. Eigenen minisign-Schlüssel erzeugen, Public Key einchecken und Secret MINISIGN_SECRET_KEY setzen. Siehe docs/CI.md."
            exit 1
          fi
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::Secret MINISIGN_SECRET_KEY fehlt. Siehe docs/CI.md."
            exit 1
          fi
          umask 077
          key="${RUNNER_TEMP}/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key"
          # minisign liest zeilenweise; ein fehlendes Newline am Ende ergänzen.
          if [ "$(tail -c1 "$key" | wc -l)" -eq 0 ]; then
            echo >> "$key"
          fi
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          cd dist
          # Stdin zu, damit ein verschlüsselter Schlüssel nicht auf eine Passwortabfrage wartet.
          minisign -S -s "$key" -m SHA256SUMS -x SHA256SUMS.minisig \
            -c "ecomsec ${RELEASE_TAG} SHA256SUMS" < /dev/null
          minisign -Vm SHA256SUMS -p "${GITHUB_WORKSPACE}/distrib/minisign.pub" -x SHA256SUMS.minisig
          rm -f "$key"

      - name: Build-Provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/ecomsec-*
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          **ecomsec** ist ein read-only Kompromittierungs-Check für JTL-Shop 5, Shopware 6, WooCommerce, Magento 2 und Shopify.
          Dieses Release enthält fertige Programme für Linux (statisch, x86_64/ARM64), macOS (Intel/Apple Silicon)
          und Windows sowie ein Container-Image unter `ghcr.io/${{ github.repository }}`. Installation:
          `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh` –
          bestehende Installationen aktualisieren sich mit `ecomsec self-update`. Alle Pakete lassen sich über
          `SHA256SUMS` und `SHA256SUMS.minisig` prüfen; die Build-Provenance mit
          `gh attestation verify <paket> --repo ${{ github.repository }}`.

          EOF
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release already exists (created by hand or by a previous run):
            # replace the assets and keep the existing notes if they are not empty.
            echo "Release $TAG exists – uploading assets"
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
            body="$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --repo "${{ github.repository }}" --title "ecomsec $TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "ecomsec $TAG" \
              --notes-file notes.md \
              --generate-notes \
              --verify-tag \
              $prerelease
          fi

  crates:
    name: crates.io
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  docker:
    name: Container image (GHCR)
    # Reuses the static Linux binaries from the build job: no compilation
    # under CPU emulation, the image contains exactly the released binaries.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: dist-*-unknown-linux-musl
          path: dist
          merge-multiple: true

      - name: Binaries für das Image bereitstellen
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; target="${pair##*:}-unknown-linux-musl"
            mkdir -p "docker-bin/${arch}"
            tar xzf "dist/ecomsec-${TAG}-${target}.tar.gz" -C "docker-bin/${arch}" \
              --strip-components=1 "ecomsec-${TAG}-${target}/ecomsec"
          done
          file docker-bin/*/ecomsec
          docker-bin/amd64/ecomsec --version

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # GHCR requires lower-case image names.
          images: ghcr.io/${{ github.repository }}
          # semver patterns read the tag from the ref; pass it explicitly on manual runs
          context: git
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=ecomsec
            org.opencontainers.image.description=Read-only Kompromittierungs-Check für JTL-Shop 5, Shopware 6, WooCommerce, Magento 2 und Shopify

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0bc # v7
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
