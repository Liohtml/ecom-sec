name: cargo-deny

# Dependency audit (advisories, licenses, bans, sources). Blocking on pull
# requests and on main; the release workflow calls this before it builds.
# A weekly schedule catches advisories published after the last push.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 3" # Mittwoch 05:30 UTC
  workflow_call:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arguments default to --all-features (placed before the subcommand).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
