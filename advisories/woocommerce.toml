# Bekannte Schwachstellen in WordPress-Core und im WooCommerce-Plugin
# (Plattform `woocommerce`).
#
# Einträge ohne `component` beziehen sich auf die WordPress-Version
# (wp-includes/version.php), Einträge mit `component = "WooCommerce"` auf die
# Version des WooCommerce-Plugins (Header in woocommerce.php).
#
# WordPress liefert Sicherheitsfixes als Minor-Release je Branch nach
# (z. B. 5.8.3, 5.7.5, … 3.7.37), daher die vielen Bereiche. Die Bereiche
# entsprechen den CPE-Konfigurationen der NVD.
#
# OSV.dev kennt kein WordPress-Ökosystem; Plugin-Schwachstellen außerhalb
# von WooCommerce prüft diese Datei nicht. `ecomsec scan --online` vergleicht
# installierte Plugins mit dem WordPress.org-Verzeichnis (veraltet = Warnung).

# ---------------------------------------------------------------- WordPress

