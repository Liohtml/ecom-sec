# Bekannte Schwachstellen in Magento 2 / Adobe Commerce (Plattform `magento2`).
#
# Versionsangaben mit Patch-Level (`2.4.6-p6`) werden korrekt verglichen:
# 2.4.6 < 2.4.6-p1 < … < 2.4.7. Adobe veröffentlicht Fixes je Release-Linie
# als neues Patch-Release (APSB-Bulletins) und zusätzlich als isolierten
# Hotfix. Ein eingespielter Hotfix ändert die Versionsnummer nicht – solche
# Installationen werden weiterhin als verwundbar gemeldet und müssen nach
# Prüfung als akzeptiert markiert werden.
#
# `component = "Adobe Commerce"` kennzeichnet Lücken, die laut Adobe/NVD nur
# die kommerzielle Edition betreffen; Magento Open Source gilt dann als
# nicht betroffen.
#
# Mit `ecomsec scan --online` werden zusätzlich alle Composer-Pakete
# (magento/*, Extensions, Bibliotheken) gegen OSV.dev geprüft.

