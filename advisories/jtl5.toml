fixed_in = ["5.8.4"]
backpatch_note = "Die Sperre nach fünf Fehlversuchen am /dbeS/-Abgleich hing an der ersten X-Forwarded-For-Angabe, die jeder Aufrufer setzen kann: Der echte Abgleich ließ sich so ohne Anmeldung blockieren (Bestellungen werden nicht abgeholt). Nur 5.8. Nach dem Update Proxy-Adressen in TRUSTED_PROXY_IPS eintragen. Nachweis an dbeS/FailedLoginLimiter.php."
