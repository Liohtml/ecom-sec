[[advisory]]
id = "JTL-SHOP-10049"
platform = "jtl5"
title = "Second-Order-SQL-Injection über Backend-Benachrichtigungen (jedes Backend-Konto)"
severity = "critical"
affected = [">=5.0.0 <5.5.5", ">=5.6.0 <5.6.6", ">=5.7.0 <5.7.6", ">=5.8.0 <5.8.3"]
fixed_in = ["5.5.5", "5.6.6", "5.7.6", "5.8.3"]
backpatch_note = "Das Ausblenden einer Backend-Benachrichtigung speichert einen beliebigen Wert als Hash, der beim nächsten Aufbau der Benachrichtigungen ungefiltert in ein DELETE eingesetzt wird. Ausnutzbar mit jedem angemeldeten Backend-Konto, unabhängig von dessen Rechten. Behoben in 5.8.3 sowie (als „SQL-Injection über die Benachrichtigungsaktion im Backend“) in 5.7.6, 5.6.6 und 5.5.5. Ein eingespielter Fix wird an Notification::isValidHash erkannt."
reference = "https://forum.jtl-software.de/threads/jtl-shop-5-8-aktuell-5-8-3.249343/"
published = 2026-11-04
tags = ["sqli", "authenticated", "backend"]
source = "JTL-Forum (Releases 5.8.3, 5.7.6, 5.6.6, 5.5.5), Code-Diff 5.8.2 → 5.8.3, Pakete 5.5.5/5.6.6/5.7.6 geprüft"

[[advisory]]
id = "JTL-2026-BACKEND-PRIVESC"
platform = "jtl5"
title = "Rechteausweitung: eingeschränkte Backend-Konten können Administratoren anlegen, ändern und deren 2FA verwalten"
severity = "critical"
