fixed_in = ["5.5.6", "5.6.7", "5.7.7", "5.8.5"]
backpatch_note = "export/.htaccess erlaubt .gz und .zip unterhalb von export/, export/backup hob das nicht auf: Datenbank- und Dateisicherungen (inkl. Konfiguration mit Zugangsdaten) waren abrufbar, sofern der Dateiname bekannt oder erratbar ist (bis 5.5.5 nur ein Zeitstempel). Der Fix wirkt nur unter Apache; nginx braucht eine eigene Sperre. Nachweis an export/backup/.htaccess; der Scan listet vorhandene Sicherungen."
reference = "https://www.jtl-software.com/de/security/sicherheitshinweis-sicherungsdateien-export_backup_abrufbar/"
published = 2026-11-24
tags = ["exposed-file", "unauthenticated", "backup", "gdpr"]
source = "JTL Security Advisory 24.11.2026, Hotfix-Diffs 5.0.0–5.8.4 und Pakete 5.5.6/5.6.7/5.7.7/5.8.5 geprüft"

