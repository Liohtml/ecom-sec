[[advisory]]
id = "JTL-2026-ADMIN-XSS"
platform = "jtl5"
title = "XSS in zwei Backend-Funktionen (Bewertungen, Freischaltungen)"
severity = "critical"
affected = [">=5.0.0 <5.6.3", ">=5.7.0 <5.7.3"]
fixed_in = ["5.6.3", "5.7.3", "5.8.0"]
