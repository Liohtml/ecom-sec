# Bekannte Schwachstellen in JTL-Shop 5.
#
# Diese Datei wird in das Binary eingebettet UND kann zur Laufzeit per
# `ecomsec advisories update` bzw. `--advisories DIR` durch eine neuere Fassung
# ersetzt werden (Einträge mit gleicher `id` überschreiben die eingebauten).
#
# Format siehe docs/ADVISORIES.md. Versionsbereiche: ">=a <b", "<b", ">=a".
# Pflege: wöchentlicher Workflow .github/workflows/advisories.yml + Review.

[[advisory]]
id = "CVE-2026-133938"
platform = "jtl5"
title = "Backend-Sprachumschaltung ohne Token: Skriptcode im Backend (CSRF + gespeichertes XSS)"
severity = "critical"
score = 9.3
affected = [">=5.2.3 <5.5.6", ">=5.6.0 <5.6.7", ">=5.7.0 <5.7.7", ">=5.8.0 <5.8.5"]
fixed_in = ["5.5.6", "5.6.7", "5.7.7", "5.8.5"]
backpatch_note = "Die Aktion quick_change_language übernimmt per GET ohne Token einen beliebigen Wert in tadminlogin.language, der im Backend ungefiltert ausgegeben wird. Ein Administrator muss nur eine präparierte Seite öffnen. Für 5.2.3–5.4 gibt es nur die Patch-Dateien vom 24.11.2026. Nachweis an AdminAccountController.php (Token-Prüfung); mit Datenbankzugang meldet der Scan ungültige Sprachwerte."
reference = "https://www.jtl-software.com/de/security/sicherheitshinweis-backend-sprachumschaltung_xss/"
published = 2026-11-24
tags = ["csrf", "xss", "backend", "cwe-352", "cwe-79"]
source = "JTL Security Advisory 24.11.2026, Hotfix-Diffs 5.0.0–5.8.4 und Pakete 5.5.6/5.6.7/5.7.7/5.8.5 geprüft"

[[advisory]]
id = "CVE-2026-133939"
platform = "jtl5"
title = "Reflektiertes XSS im OPC-Startmenü"
severity = "critical"
score = 9.3
affected = [">=5.0.0 <5.5.6", ">=5.6.0 <5.6.7", ">=5.7.0 <5.7.7", ">=5.8.0 <5.8.5"]
fixed_in = ["5.5.6", "5.6.7", "5.7.7", "5.8.5"]
backpatch_note = "Suchbegriff, Seitenkennung und Adressen wurden im OPC-Startmenü ungefiltert in JavaScript ausgegeben; ein Klick eines angemeldeten Backend-Nutzers auf einen präparierten Link genügt. Seit Einführung des OPC betroffen, für 5.0–5.4 nur Patch-Dateien. Nachweis an admin/opc/tpl/startmenu.tpl."
reference = "https://www.jtl-software.com/de/security/sicherheitshinweis-opc-startmenue_xss/"
published = 2026-11-24
tags = ["xss", "opc", "backend"]
source = "JTL Security Advisory 24.11.2026, Hotfix-Diffs 5.0.0–5.8.4 und Pakete 5.5.6/5.6.7/5.7.7/5.8.5 geprüft"

[[advisory]]
id = "CVE-2026-133940"
platform = "jtl5"
title = "Sicherungsdateien in export/backup ohne Anmeldung abrufbar"
severity = "critical"
score = 8.2
