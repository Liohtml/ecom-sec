[[advisory]]
id = "CVE-2026-123058"
platform = "jtl5"
title = "Web-Installer sperrt sich nach der Installation nicht"
severity = "critical"
score = 9.0
affected = [">=5.0.0 <5.5.5", ">=5.6.0 <5.6.6", ">=5.7.0 <5.7.6", ">=5.8.0 <5.8.4"]
fixed_in = ["5.5.5", "5.6.6", "5.7.6", "5.8.4"]
backpatch_note = "Solange install/ erreichbar ist, nimmt der Installer fremde Datenbank-Zugangsdaten an, legt Admin- und Sync-Konten an und überschreibt die Konfiguration – ohne Anmeldung. Das Update löscht ein vorhandenes install/-Verzeichnis nicht: sofort entfernen. Nachweis an Installation/VueInstaller.php; der Scan meldet ein vorhandenes install/-Verzeichnis."
reference = "https://www.jtl-software.com/de/security/sicherheitshinweis-web-installer_nicht_gesperrt/"
published = 2026-11-12
