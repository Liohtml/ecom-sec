reference = "https://forum.jtl-software.de/threads/jtl-shop-5-8-aktuell-5-8-3.249343/"
published = 2026-11-04
tags = ["privilege-escalation", "authenticated", "2fa", "backend"]
source = "Pakete 5.5.6/5.6.7/5.7.7 geprüft (kein Backport); JTL-Forum (Release 5.8.3, „mehrere Security Fixes mit severity high“), Code-Diff 5.8.2 → 5.8.3"

