# Core content rules (YARA-lite).  Derived from the public NSA/ASD web-shell
# detection guidance and from recurring obfuscation techniques seen in PHP
# malware.  Each rule lists its strings; the `condition` says how many of them
# must hit.  `applies_to` restricts the file class (`php`, `htaccess`,
# `template`, `js`, `log`, `image`, `other`, `any`).  `within = N` requires the
# strings inside one window of N bytes.
#
# PHP and JavaScript are additionally scanned after de-obfuscation.  In those
# layers a string that was assembled from fragments, escapes or decoder calls
# carries the prefix `/*@hidden*/`; the class `decoded` selects payloads that
# were unpacked from Base64/deflate wrappers.

# ---------------------------------------------------------------- eval chains

[[rule]]
name = "php_eval_base64"
description = "eval() mit base64-dekodierter/komprimierter Nutzlast – klassische Einzeiler-Backdoor"
severity = "critical"
tags = ["webshell", "obfuscation"]
reference = "https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF"
strings = [
  { regex = '\beval\s*\(\s*(@\s*)?(base64_decode|gzinflate|gzuncompress|gzdecode|str_rot13|strrev|rawurldecode|urldecode|hex2bin|convert_uudecode)\s*\(', nocase = true },
  { regex = '\b(assert|create_function)\s*\(\s*(@\s*)?(base64_decode|gzinflate|gzuncompress|str_rot13|strrev)\s*\(', nocase = true },
]

[[rule]]
name = "php_eval_request_input"
description = "Direkte Ausführung von Request-Eingaben (eval/assert/system mit $_GET/$_POST/$_REQUEST/$_COOKIE)"
severity = "critical"
tags = ["webshell"]
strings = [
  { regex = '\b(eval|assert|system|passthru|shell_exec|exec|popen|proc_open|pcntl_exec)\s*\(\s*(@\s*)?(stripslashes\s*\(\s*)?\$(_GET|_POST|_REQUEST|_COOKIE|_SERVER|GLOBALS)\s*\[', nocase = true },
  { regex = '@?\$_(GET|POST|REQUEST|COOKIE)\s*\[[^\]]{1,64}\]\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)', nocase = true },
]

[[rule]]
name = "php_china_chopper"
description = "China-Chopper-Einzeiler: @eval($_POST[...])"
severity = "critical"
tags = ["webshell"]
reference = "https://www.cisa.gov/news-events/alerts/2015/11/10/compromised-web-servers-and-web-shells-threat-awareness-and-guidance"
strings = [
  { regex = '@\s*eval\s*\(\s*\$_(POST|GET|REQUEST|COOKIE)\s*\[', nocase = true },
  { regex = 'eval\s*\(\s*\$_(POST|GET|REQUEST)\s*\[\s*[\x27"][a-z0-9_]{1,16}[\x27"]\s*\]\s*\)\s*;', nocase = true },
]

[[rule]]
name = "php_preg_replace_eval"
description = "preg_replace mit /e-Modifier führt Eingaben aus (Backdoor-Idiom für PHP < 7)"
severity = "critical"
tags = ["webshell", "obfuscation"]
strings = [
  # Pattern literal with the same quote on both sides, a delimiter and a
  # modifier group that contains `e`.
  { regex = 'preg_replace\s*\(\s*\x27([/#~@!|%])[^\x27\n]*([/#~@!|%])[imsxuADSUXJ]*e[imsxuADSUXJ]*\x27\s*,' },
  { regex = 'preg_replace\s*\(\s*"([/#~@!|%])[^"\n]*([/#~@!|%])[imsxuADSUXJ]*e[imsxuADSUXJ]*"\s*,' },
]

[[rule]]
name = "php_dynamic_function_from_input"
description = "Variable Funktion aus Request-Daten oder dekodierten Strings aufgebaut"
severity = "critical"
tags = ["webshell", "obfuscation"]
condition = "all"
within = 800
strings = [
  { regex = '\$[a-z_][a-z0-9_]*\s*=\s*(base64_decode|str_rot13|strrev|gzinflate|hex2bin)\s*\(\s*(\$_(GET|POST|REQUEST|COOKIE|SERVER)\s*\[|[\x27"][A-Za-z0-9+/=]{16,}[\x27"])', nocase = true },
  { regex = '\$[a-z_][a-z0-9_]*\s*\(\s*(\$[a-z_][a-z0-9_]*|\$_(GET|POST|REQUEST|COOKIE)\s*\[)', nocase = true },
]

[[rule]]
name = "php_hex_escaped_builtin"
description = "Funktionsname in Hex-/Oktal-Escapes versteckt (z. B. \\x65\\x76\\x61\\x6c = eval)"
severity = "critical"
tags = ["obfuscation"]
strings = [
  { regex = '\\x65\\x76\\x61\\x6c', nocase = true },
  { regex = '\\x61\\x73\\x73\\x65\\x72\\x74', nocase = true },
  { regex = '\\x73\\x79\\x73\\x74\\x65\\x6d', nocase = true },
  { regex = '\\x62\\x61\\x73\\x65\\x36\\x34', nocase = true },
  { regex = '\\x70\\x61\\x73\\x73\\x74\\x68\\x72\\x75', nocase = true },
  { regex = '\\x73\\x68\\x65\\x6c\\x6c\\x5f\\x65\\x78\\x65\\x63', nocase = true },
  { regex = '\\x67\\x7a\\x69\\x6e\\x66\\x6c\\x61\\x74\\x65', nocase = true },
  { regex = '"\\145\\166\\141\\154"' },
  { regex = '\$\{\s*"\\x47\\x4c\\x4f\\x42\\x41\\x4c\\x53"', nocase = true },
  { regex = '\$\{"\\x47LOBALS"\}', nocase = true },
]

[[rule]]
name = "php_hex_escaped_string_executed"
description = "Lange Hex-Escape-Zeichenketten in Kombination mit dynamischer Ausführung"
severity = "warning"
tags = ["obfuscation"]
condition = "all"
strings = [
  { regex = '(\\x[2-7][0-9a-f]){8,}', nocase = true },
  { regex = '\b(eval|assert|create_function|call_user_func(_array)?)\s*\(|\$[a-z_][a-z0-9_]*\s*\(\s*\$', nocase = true },
]

[[rule]]
name = "php_chr_concatenation"
description = "Lange chr()-Verkettungen zum Verstecken von Strings"
severity = "warning"
tags = ["obfuscation"]
strings = [
  { regex = '(chr\s*\(\s*\d{1,3}\s*\)\s*\.\s*){6,}', nocase = true },
]

[[rule]]
name = "php_long_base64_blob_executed"
description = "Sehr langer Base64-Block, der dekodiert und ausgeführt wird"
severity = "critical"
tags = ["obfuscation"]
condition = "all"
strings = [
  { regex = '[\x27"][A-Za-z0-9+/=]{400,}[\x27"]' },
  { regex = '\b(base64_decode|gzinflate|gzuncompress|str_rot13)\b', nocase = true },
  { regex = '\b(eval|assert|create_function|call_user_func|array_map|preg_replace_callback|include|require)\b', nocase = true },
]

[[rule]]
name = "php_obfuscated_variable_soup"
description = "Typische Obfuscator-Ausgabe: viele Kurzvariablen plus GLOBALS-Indirektion"
severity = "warning"
tags = ["obfuscation"]
condition = "2"
strings = [
  { regex = '\$GLOBALS\s*\[\s*[\x27"][a-z0-9_]{1,12}[\x27"]\s*\]\s*\[\s*\d+\s*\]', nocase = true },
  { regex = '(\$[a-zA-Z_]\w{0,2}\s*=\s*[\x27"][^\x27"]{0,3}[\x27"]\s*;\s*){8,}' },
  { regex = 'error_reporting\s*\(\s*0\s*\)\s*;\s*@?(set_time_limit|ini_set|ignore_user_abort)', nocase = true },
]

[[rule]]
name = "php_goto_obfuscation"
description = "goto-basierte Kontrollfluss-Verschleierung (kommerzielle PHP-Obfuscator und Malware)"
severity = "warning"
tags = ["obfuscation"]
strings = [
  { regex = '(goto\s+[A-Za-z0-9_]{4,}\s*;\s*[A-Za-z0-9_]{4,}\s*:\s*){5,}' },
]

# ---------------------------------------------------------------- known shells

[[rule]]
name = "php_known_shell_markers"
description = "Kennzeichnende Strings bekannter Webshells (WSO, c99, b374k, FilesMan, Alfa, P0wny, …)"
severity = "critical"
tags = ["webshell"]
strings = [
  { regex = '\bFilesMan\b' },
  { regex = '\b(c99sh(ell)?|c100shell|r57shell|b374k|wso_?(version|shell)|alfa\s?(shell|team)|indoxploit|p0wny|weevely|marijuana\s?shell|Locus7s|phpjackal|CyberWarfare)\b', nocase = true },
  { regex = '(Uname|Safe-mode|Safe mode|Disable functions):\s*(</?b>|\$|\{|<font|<span)', nocase = true },
  { regex = 'WSO\s+[0-9.]+\s*</title>', nocase = true },
  { regex = '<title>.{0,30}(webshell|backdoor|hacked by|priv8|bypass shell).{0,30}</title>', nocase = true },
]

[[rule]]
name = "php_shell_command_panel"
description = "Shell-Funktionskombination: Befehlsausführung plus Upload/Bearbeiten plus Selbstlöschung"
severity = "critical"
tags = ["webshell"]
condition = "3"
strings = [
  { regex = '\b(system|passthru|shell_exec|exec|popen|proc_open)\s*\(', nocase = true },
  { regex = 'move_uploaded_file\s*\(', nocase = true },
  { regex = '\bunlink\s*\(\s*__FILE__', nocase = true },
  { regex = 'php_uname\s*\(', nocase = true },
  { regex = 'posix_getpwuid\s*\(', nocase = true },
  { regex = 'chmod\s*\(\s*[^,]+,\s*0?777', nocase = true },
  { regex = 'fsockopen\s*\(', nocase = true },
  { regex = 'set_time_limit\s*\(\s*0\s*\)', nocase = true },
]

[[rule]]
name = "php_reverse_shell"
description = "Reverse Shell: Socket-Verbindung mit gestarteter Shell"
severity = "critical"
tags = ["webshell"]
condition = "all"
strings = [
  { regex = '(fsockopen|stream_socket_client|socket_create|socket_connect)\s*\(', nocase = true },
  { regex = '/bin/(ba)?sh\s+-i|proc_open\s*\(\s*\$?(shell|cmd|sh)\b|pcntl_fork\s*\(|(exec|popen|system|passthru)\s*\(\s*["\x27]?/bin/(ba)?sh|\$?(sock|socket|fp)\b[^;]{0,40}(STDIN|0=>|2>&1)', nocase = true },
]

[[rule]]
name = "php_uploader_dropper"
description = "Minimaler Datei-Dropper, der Request-Daten auf die Platte schreibt"
severity = "critical"
tags = ["webshell"]
strings = [
  { regex = 'file_put_contents\s*\(\s*[^,]{1,80},\s*(@\s*)?(base64_decode\s*\()?\s*\$_(GET|POST|REQUEST|COOKIE|FILES)', nocase = true },
  { regex = 'fwrite\s*\(\s*\$[a-z_]+\s*,\s*(base64_decode\s*\()?\s*\$_(GET|POST|REQUEST|COOKIE)', nocase = true },
  { regex = 'copy\s*\(\s*\$_FILES\s*\[[^\]]+\]\s*\[\s*[\x27"]tmp_name', nocase = true },
]

[[rule]]
name = "php_auth_cookie_backdoor"
description = "Backdoor-Schleuse: Passwort-/User-Agent-Prüfung gefolgt von eval"
severity = "critical"
tags = ["webshell"]
condition = "all"
within = 1200
strings = [
  { regex = '(md5|sha1|crc32)\s*\(\s*\$_(GET|POST|REQUEST|COOKIE|SERVER)\s*\[', nocase = true },
  { regex = '\b(eval|assert|system|passthru|shell_exec)\s*\(', nocase = true },
]

[[rule]]
name = "php_header_cloaking"
description = "Cloaking: andere Inhalte für Suchmaschinen/Referer (SEO-Spam-Injektion)"
severity = "warning"
tags = ["seo-spam"]
condition = "2"
strings = [
  { regex = 'HTTP_USER_AGENT[^;]{0,120}(googlebot|bingbot|yandex|baiduspider)', nocase = true },
  { regex = 'HTTP_REFERER[^;]{0,120}(google|bing|yahoo|yandex)', nocase = true },
  { regex = '(curl_exec|file_get_contents)\s*\([^)]{0,200}(\.ru|\.cn|\.tk|\.top|\.xyz)', nocase = true },
  { regex = '(viagra|cialis|casino|porn|replica|louis vuitton|payday loan)', nocase = true },
]

[[rule]]
name = "php_mailer_spam"
description = "Massenmailer-Script (mail() in Schleife mit per Request gesteuerten Empfängern)"
severity = "warning"
tags = ["spam"]
condition = "all"
strings = [
  { regex = '\bmail\s*\(\s*\$', nocase = true },
  { regex = '\$_(POST|GET|REQUEST)\s*\[\s*[\x27"](to|email|emails|list|rcpt|subject|from)[\x27"]', nocase = true },
  { regex = '\b(foreach|while|for)\s*\(', nocase = true },
]

[[rule]]
name = "php_card_skimmer"
description = "Serverseitiger Zahlungsdaten-Skimmer: Kartendaten erfasst und versendet"
severity = "critical"
tags = ["skimmer", "magecart"]
condition = "2"
strings = [
  { regex = '\$_(POST|REQUEST)\s*\[\s*[\x27"][^\x27"]{0,40}(cc_?number|card_?number|cardnumber|cc_?cid|cvv2?|cvc2?|cc_?exp|card_?exp|exp_?month|exp_?year)', nocase = true },
  { regex = 'curl_setopt\s*\([^,]+,\s*CURLOPT_POSTFIELDS\s*,\s*(base64_encode|json_encode|serialize|http_build_query)\s*\(\s*\$_(POST|REQUEST)', nocase = true },
  { regex = 'base64_encode\s*\(\s*(json_encode|serialize)\s*\(\s*\$_(POST|REQUEST)', nocase = true },
  { regex = '(mail|wp_mail|file_put_contents|fwrite)\s*\([^;]{0,120}\$_(POST|REQUEST)\s*\[\s*[\x27"][^\x27"]{0,40}(cc_?number|card_?number|cvv|cvc)', nocase = true },
]

[[rule]]
name = "php_remote_include"
description = "Remote File Inclusion über http(s)/ftp/data/php-Wrapper"
severity = "critical"
tags = ["webshell"]
strings = [
  { regex = '\b(include|require|include_once|require_once)\s*\(?\s*[\x27"](https?|ftps?|data|php://input|php://filter|expect)://', nocase = true },
  { regex = '\b(include|require|include_once|require_once)\s*\(?\s*\$_(GET|POST|REQUEST|COOKIE)\s*\[', nocase = true },
]

[[rule]]
name = "php_hidden_in_image_header"
description = "PHP-Code hinter einer Bildsignatur (Polyglot-Upload)"
severity = "critical"
tags = ["webshell", "upload"]
applies_to = ["any"]
condition = "all"
strings = [
  { regex = '^(\xff\xd8\xff|\x89PNG|GIF8[79]a|RIFF....WEBP|BM)' },
  { regex = '<\?php[\s(]|<\?=\s*[$a-z]|<script\s+language\s*=\s*[\x27"]php', nocase = true },
]

# ---------------------------------------------------------------- JS / storefront

[[rule]]
name = "js_skimmer_exfil"
description = "Clientseitiger Skimmer (Magecart): Kartendaten werden kodiert und an einen Endpunkt gesendet"
severity = "critical"
tags = ["skimmer", "magecart"]
applies_to = ["js", "template"]
condition = "all"
within = 1500
strings = [
  { regex = '(cc_?number|card_?number|cardnumber|cvv2?\b|cvc2?\b|ccexp|cc_?exp(iry|_?date|_?month|_?year)|card_?exp(iry|_?date|_?month|_?year)|exp_?month|exp_?year)', nocase = true },
  { regex = '((btoa|encodeURIComponent)\s*\(\s*(JSON\.stringify|unescape|btoa)|new\s+Image\(\)\.src\s*=|navigator\.sendBeacon\s*\(|new\s+WebSocket\s*\(\s*(atob\s*\(|["\x27`]wss?://)|\.src\s*=\s*["\x27`]https?://[^"\x27`]{1,120}\?[a-z0-9_]{1,20}=["\x27`]\s*\+\s*(btoa|encodeURIComponent|window\.btoa))', nocase = true },
  { regex = '(document\.(querySelectorAll|getElementsByTagName|getElementById|querySelector)\s*\(|\.value\b|serialize\s*\()', nocase = true },
]

[[rule]]
name = "js_skimmer_patterns"
description = "Clientseitiger Skimmer (Magecart): Formulardaten abgegriffen und an externen Host gesendet"
severity = "warning"
tags = ["skimmer", "magecart"]
applies_to = ["js", "template"]
condition = "4"
within = 3000
strings = [
  { regex = '(cc_?number|cardnumber|card_number|cvv|cvc|expiry|exp_?date|ccexp)', nocase = true },
  { regex = '(btoa|atob)\s*\(\s*(JSON\.stringify|unescape|encodeURIComponent)', nocase = true },
  { regex = '(new\s+Image\(\)\.src|navigator\.sendBeacon|fetch\s*\(|XMLHttpRequest)\s*[^;]{0,200}(btoa|base64)', nocase = true },
  { regex = 'document\.(querySelectorAll|getElementsByTagName)\s*\(\s*[\x27"](input|form)[\x27"]', nocase = true },
  { regex = 'onsubmit|addEventListener\s*\(\s*[\x27"](submit|click)[\x27"]', nocase = true },
]

[[rule]]
name = "js_obfuscated_eval"
description = "Verschleiertes JavaScript, das zur Laufzeit ausgewertet wird"
severity = "warning"
tags = ["obfuscation", "js"]
applies_to = ["js", "template"]
strings = [
  { regex = 'eval\s*\(\s*(atob|unescape|decodeURIComponent|String\.fromCharCode)\s*\(', nocase = true },
  { regex = 'new\s+Function\s*\(\s*(atob|unescape)\s*\(', nocase = true },
  { regex = '(\\x[2-7][0-9a-f]){12,}', nocase = true },
  { regex = 'String\.fromCharCode\((\s*\d{1,3}\s*,){20,}' },
]

# ---------------------------------------------------------------- hidden names
#
# These rules match the marker that the de-obfuscation step puts in front of
# strings assembled from fragments (`'sys'.'tem'`), escapes (`"\x73ystem"`),
# `chr()` chains or decoder calls (`strrev('metsys')`).

[[rule]]
name = "php_hidden_function_name"
description = "Name einer Ausführungsfunktion aus Fragmenten, Escapes oder Dekodier-Aufrufen zusammengesetzt"
severity = "critical"
tags = ["webshell", "obfuscation", "deobfuscated"]
strings = [
  { regex = '/\*@hidden\*/\x27\\?(assert|system|exec|shell_exec|passthru|popen|proc_open|pcntl_exec|create_function)\x27', nocase = true },
]

[[rule]]
name = "php_hidden_superglobal"
description = "Superglobale ($_POST, $_REQUEST, $GLOBALS …) über einen zusammengesetzten Namen angesprochen"
severity = "critical"
tags = ["webshell", "obfuscation", "deobfuscated"]
strings = [
  { regex = '/\*@hidden\*/\x27(_GET|_POST|_REQUEST|_COOKIE|_SERVER|_FILES|GLOBALS)\x27' },
]

[[rule]]
name = "php_hidden_decoder_name"
description = "Name einer Dekodier- oder Schreibfunktion aus Fragmenten zusammengesetzt (Umgehung von Textsuchen)"
severity = "warning"
tags = ["obfuscation", "deobfuscated"]
strings = [
  { regex = '/\*@hidden\*/\x27\\?(eval|base64_decode|gzinflate|gzuncompress|gzdecode|str_rot13|strrev|hex2bin|call_user_func(_array)?|file_put_contents|move_uploaded_file|preg_replace)\x27', nocase = true },
]

[[rule]]
name = "encoded_payload_executes_code"
description = "Kodierte Nutzlast enthält ausführbaren Code (Befehlsausführung, Request-Eingaben, weitere Dekodierstufen)"
severity = "critical"
tags = ["webshell", "obfuscation", "deobfuscated"]
applies_to = ["decoded"]
condition = "2"
within = 4000
strings = [
  { regex = '<\?php[\s(]', nocase = true },
  { regex = '\b(eval|assert|create_function)\s*\(', nocase = true },
  { regex = '\$_(GET|POST|REQUEST|COOKIE|FILES)\s*\[|\$_SERVER\s*\[\s*[\x27"]HTTP_' },
  { regex = '\b(system|shell_exec|passthru|proc_open|popen|pcntl_exec)\s*\(', nocase = true },
  { regex = '\b(file_put_contents|fwrite|move_uploaded_file)\s*\(', nocase = true },
  { regex = '\b(gzinflate|gzuncompress|str_rot13)\s*\(\s*base64_decode\s*\(', nocase = true },
]

[[rule]]
name = "js_encoded_payload_loader"
description = "Kodierte JavaScript-Nutzlast lädt fremden Code nach oder sendet Formulardaten"
severity = "critical"
category = "third_party_injection"
tags = ["skimmer", "obfuscation", "deobfuscated"]
applies_to = ["decoded"]
condition = "3"
within = 1500
strings = [
  { regex = 'createElement\s*\(\s*[\x27"`]script[\x27"`]', nocase = true },
  { regex = '\.src\s*=|\.appendChild\s*\(|insertBefore\s*\(' },
  { regex = '\b(fetch|XMLHttpRequest|WebSocket)\b|navigator\.sendBeacon|new\s+Image\b' },
  { regex = 'document\.cookie|localStorage|querySelector(All)?\s*\(\s*[\x27"`](input|form|select)|\.value\b' },
  { regex = '[\x27"`](https?:)?//[a-z0-9.-]+\.[a-z]{2,}[/\x27"`?:]|[\x27"`]wss?://', nocase = true },
]

[[rule]]
name = "js_hidden_loader"
description = "JavaScript setzt eval/atob/fromCharCode oder eine Lade-Adresse aus Fragmenten bzw. Escapes zusammen"
severity = "warning"
tags = ["obfuscation", "js", "deobfuscated"]
applies_to = ["js", "template"]
condition = "all"
within = 1200
strings = [
  { regex = '/\*@hidden\*/\x27((https?:)?//[a-z0-9.-]+\.[a-z]{2,}|wss?://|eval\x27|atob\x27|fromCharCode\x27)', nocase = true },
  { regex = 'createElement|\.src\s*=|\bfetch\s*\(|sendBeacon|WebSocket|XMLHttpRequest|new\s+Function|\[\s*/\*@hidden\*/' },
]

# ---------------------------------------------------------------- execution paths

[[rule]]
name = "php_callback_exec_input"
description = "Callback-Funktion erhält ihren Funktionsnamen aus Request-Daten (call_user_func, array_map, usort …)"
severity = "critical"
tags = ["webshell"]
strings = [
  { regex = '\b(call_user_func(_array)?|array_map|register_shutdown_function|register_tick_function|ob_start)\s*\(\s*(@\s*)?\$_(GET|POST|REQUEST|COOKIE)\s*\[', nocase = true },
  { regex = '\b(array_filter|array_walk|usort|uasort|uksort)\s*\([^;(){},]{1,80},\s*(@\s*)?\$_(GET|POST|REQUEST|COOKIE)\s*\[', nocase = true },
  { regex = 'new\s+ReflectionFunction\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\[', nocase = true },
]

[[rule]]
name = "php_exec_decoded_request_input"
description = "Request-Daten oder HTTP-Header werden dekodiert und ausgeführt"
severity = "critical"
tags = ["webshell"]
strings = [
  { regex = '\b(eval|assert|system|passthru|shell_exec|exec|popen|proc_open|create_function)\s*\(\s*(@\s*)?((base64_decode|gzinflate|gzuncompress|str_rot13|strrev|hex2bin|urldecode|rawurldecode|stripslashes|trim)\s*\(\s*)+(\$_(GET|POST|REQUEST|COOKIE)\s*\[|\$_SERVER\s*\[\s*[\x27"]HTTP_|getallheaders\s*\(|apache_request_headers\s*\()', nocase = true },
  { regex = '\b(eval|assert|system|passthru|shell_exec|popen|proc_open)\s*\(\s*(@\s*)?(\$_SERVER\s*\[\s*[\x27"]HTTP_|getallheaders\s*\(\s*\)\s*\[|apache_request_headers\s*\(\s*\)\s*\[)', nocase = true },
  { regex = '\b(eval|assert|include|require|include_once|require_once)\s*\(?\s*(@\s*)?((base64_decode|gzinflate|stripslashes)\s*\(\s*)*file_get_contents\s*\(\s*[\x27"]php://input', nocase = true },
]

[[rule]]
name = "php_backtick_exec_input"
description = "Shell-Ausführung über Backticks mit Request-Daten"
severity = "critical"
tags = ["webshell"]
strings = [
  { regex = '(=|\becho|\bprint|\breturn|\()\s*`[^`\n]{0,80}\$_(GET|POST|REQUEST|COOKIE)\s*\[[^`\n]{0,80}`\s*[;)]', nocase = true },
]

[[rule]]
name = "php_nonalpha_webshell"
description = "PHP ohne Buchstaben: Funktionsnamen per XOR, Bit-Negation oder Inkrement erzeugt"
severity = "critical"
tags = ["webshell", "obfuscation"]
strings = [
  { regex = '(\$_+\s*\+\+\s*;\s*){4,}' },
  { regex = '[\x27"][^\x27"\w\s]{2,12}[\x27"]\s*\^\s*[\x27"][^\x27"\w\s]{2,12}[\x27"]' },
  { regex = '~\s*\(?\s*[\x27"][\x80-\xff]{4,}[\x27"]' },
  { regex = '~\s*\(?\s*"(\\x[89a-f][0-9a-f]){4,}"', nocase = true },
]

[[rule]]
name = "php_extract_request_exec"
description = "extract() auf Request-Daten direkt vor einem Aufruf über eine Variable"
severity = "warning"
tags = ["webshell"]
condition = "all"
within = 200
strings = [
  { regex = '\bextract\s*\(\s*\$_(REQUEST|GET|POST|COOKIE)\b', nocase = true },
  { regex = '[;{}]\s*@?\$[a-z_][a-z0-9_]*\s*\(\s*\$[a-z_]', nocase = true },
]

[[rule]]
name = "php_disable_functions_bypass"
description = "Umgehung von disable_functions (LD_PRELOAD über mail(), FFI)"
severity = "critical"
tags = ["webshell", "privilege"]
strings = [
  { regex = 'putenv\s*\(\s*[\x27"]LD_PRELOAD=', nocase = true },
  { regex = 'FFI::cdef\s*\([^;]{0,300}\b(system|popen|execve?)\b', nocase = true },
]

[[rule]]
name = "php_phpinfo_only"
description = "Datei besteht nur aus phpinfo() – legt Pfade, Module und Umgebungsvariablen offen"
severity = "warning"
category = "exposed_file"
tags = ["diagnostic"]
strings = [
  { regex = '^(\xef\xbb\xbf)?\s*<\?(php)?\s*(@\s*)?phpinfo\s*\(\s*(-1|INFO_ALL)?\s*\)\s*;?\s*(\?>)?\s*$', nocase = true },
]

# ---------------------------------------------------------------- PHP in other files

[[rule]]
name = "php_code_in_image"
description = "Bilddatei enthält ausführbaren PHP-Code (wird per include oder Handler-Trick gestartet)"
severity = "critical"
category = "code_in_upload_dir"
tags = ["webshell", "polyglot", "loader"]
reference = "https://blog.sucuri.net/2021/02/malware-hiding-in-fake-ico-files.html"
applies_to = ["image"]
condition = "all"
within = 4000
strings = [
  { regex = '<\?(php[\s(]|=\s*[$@])', nocase = true },
  { regex = '\b(eval|assert|base64_decode|gzinflate|str_rot13|create_function|system|shell_exec|passthru)\s*\(|\$GLOBALS\s*\[|\$_(GET|POST|REQUEST|COOKIE)\s*\[', nocase = true },
]

[[rule]]
name = "php_file_with_foreign_extension"
description = "Datei ohne PHP-Endung beginnt mit PHP-Code und führt dekodierte Daten oder Request-Eingaben aus"
severity = "critical"
tags = ["webshell", "loader"]
applies_to = ["other"]
condition = "all"
strings = [
  { regex = '^(\xef\xbb\xbf)?\s*<\?(php[\s(]|=)', nocase = true },
  { regex = '\b(eval|assert|create_function|system|shell_exec|passthru|proc_open)\s*\(\s*(@\s*)?(\$_(GET|POST|REQUEST|COOKIE)|base64_decode|gzinflate|gzuncompress|str_rot13|\$[a-z_]\w*\s*\()', nocase = true },
]
