    vulnerable: { label: 'Verwundbar', cls: 'critical', icon: 'critical' }, unknown: { label: 'Unbekannt', cls: 'unknown', icon: 'unknown' }
  };
  var REVIEW = {
    confirmed: { label: 'bestätigt', cls: 'critical' },
    likely_false_positive: { label: 'wahrscheinlich Fehlalarm', cls: 'ok' },
    needs_human: { label: 'manuelle Prüfung nötig', cls: 'warning' }
  };
  var VERDICT = {
    critical: { label: 'Kritische Befunde – sofort handeln', kicker: 'Rot · sofort handeln', light: 'r', icon: 'critical',
      text: 'Der Scan hat Spuren gefunden, die auf eine Kompromittierung oder eine ausnutzbare Schwachstelle hindeuten. Die kritischen Befunde sollten heute geprüft und die Sofortmaßnahmen umgesetzt werden.' },
    warning: { label: 'Warnungen – zeitnah prüfen', kicker: 'Gelb · zeitnah prüfen', light: 'y', icon: 'warning',
      text: 'Keine kritischen Befunde, aber Auffälligkeiten, die in den nächsten Tagen geprüft werden sollten. Bekannte, harmlose Fälle lassen sich als unbedenklich markieren.' },
    clean: { label: 'Keine kritischen Befunde', kicker: 'Grün · kein akuter Handlungsbedarf', light: 'g', icon: 'ok',
      text: 'Der Scan hat keine kritischen Befunde und keine Warnungen ergeben. Ein sauberes Ergebnis ist keine Garantie – den Shop regelmäßig erneut prüfen.' }
  };
  var GRADE_LABEL = { A: 'sehr gut', B: 'gut', C: 'befriedigend', D: 'mangelhaft', F: 'ungenügend' };
  function catLabel(c) { return (META.categories && META.categories[c]) || c; }
  function shortId(id) { return '#' + id; }

  var findingsById = {};
  R.findings.forEach(function (f) { findingsById[f.id] = f; });
  var open = R.findings.filter(function (f) { return !f.accepted; });
  var counts = { critical: 0, warning: 0, info: 0, accepted: 0 };
  R.findings.forEach(function (f) { if (f.accepted) counts.accepted++; else counts[f.severity]++; });
  var posture = META.posture || { score: R.score, grade: R.grade, drivers: R.score_drivers || [] };
  var target = ROOT || (R.platform && R.platform.target) || (R.platform && R.platform.id) || '';
  var platformName = (R.platform && R.platform.name) || 'Shop';
  var version = (R.platform && R.platform.version) || 'unbekannt';

  // ---------------------------------------------------------------- summary
  function scoreTone(grade) { return grade === 'A' || grade === 'B' ? 'ok' : grade === 'C' ? 'warn' : 'crit'; }

  function ring(score, grade) {
    var r = 54, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, Number(score) || 0));
    var tone = scoreTone(grade);
    var col = tone === 'ok' ? 'var(--ok)' : tone === 'warn' ? 'var(--warn)' : 'var(--crit)';
    var trk = tone === 'ok' ? 'var(--ok-bg)' : tone === 'warn' ? 'var(--warn-bg)' : 'var(--crit-bg)';
    return '<div class="ring" role="img" aria-label="Sicherheitsniveau ' + v + ' von 100, Note ' + esc(grade) + '">' +
      '<svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + trk + '" stroke-width="11"/>' +
      (v > 0 ? '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + (c * v / 100).toFixed(2) + ' ' + c.toFixed(2) + '"/>' : '') +
      '</svg><div class="ring-center"><div class="score-num">' + v + '</div><div class="score-of">von 100</div></div></div>';
  }

  function topRecommendations(n) {
    var all = [];
    (R.recommendations || []).forEach(function (g, gi) {
      (g.items || []).forEach(function (it, ii) { all.push({ g: g, gi: gi, it: it, ii: ii }); });
    });
    all.sort(function (a, b) { return (a.it.priority - b.it.priority) || (a.gi - b.gi) || (a.ii - b.ii); });
    return all.slice(0, n);
  }

  function prioChip(p) {
    var cls = p <= 1 ? 'p1' : p === 2 ? 'p2' : 'p3';
    return '<span class="prio ' + cls + '">Priorität ' + esc(p) + '</span>';
  }

  function renderSummary() {
    var v = VERDICT[R.verdict] || VERDICT.clean;
    var grade = posture.grade || '–';
    var drivers = (posture.drivers || []).slice(0, 3);
    var s = R.summary || {};
    var vulnerable = (R.advisories || []).filter(function (a) { return a.state === 'vulnerable'; }).length;
    var intIssues = (R.integrity || []).filter(function (i) { return i.status === 'critical' || i.status === 'warning'; }).length;
    var details = (R.platform && R.platform.details) || [];

    var h = '';
    h += '<section class="sec" id="zusammenfassung" aria-labelledby="h-sum">';
    h += '<div class="doc-head"><div><h1 id="h-sum">Sicherheitsbericht</h1><div class="sub">Kompromittierungs-Check für ' + esc(platformName) + ' · <span class="mono">' + esc(target) + '</span></div></div>' +
      '<div class="stamp">Scan vom <b>' + fmtDateTime(R.generated_at) + '</b><br>Referenzdatum <b>' + fmtDate(R.reference_date) + '</b></div></div>';

    // hero
    h += '<div class="card hero v-' + esc(R.verdict) + '">';
    h += '<div class="hero-main"><div class="light" aria-hidden="true"><i class="r' + (v.light === 'r' ? ' on' : '') + '"></i><i class="y' + (v.light === 'y' ? ' on' : '') + '"></i><i class="g' + (v.light === 'g' ? ' on' : '') + '"></i></div>';
    h += '<div><div class="verdict-kicker">' + icon(v.icon) + 'Ergebnis · ' + esc(v.kicker) + '</div><h2 class="verdict-title">' + esc(v.label) + '</h2><p class="verdict-text">' + esc(v.text) + '</p>';
    h += '<div class="counts-inline">' +
      '<span class="chip big s-critical">' + icon('critical') + plural(counts.critical, 'kritischer Befund', 'kritische Befunde') + '</span>' +
      '<span class="chip big s-warning">' + icon('warning') + plural(counts.warning, 'Warnung', 'Warnungen') + '</span>' +
      '<span class="chip big s-info">' + icon('info') + plural(counts.info, 'Hinweis', 'Hinweise') + '</span>' +
      (counts.accepted ? '<span class="chip big s-accepted">' + icon('accepted') + fmtNum(counts.accepted) + ' unbedenklich</span>' : '') +
      '</div></div></div>';
    h += '<div class="hero-score">' + ring(posture.score, grade) + '<div style="min-width:0"><div class="grade-line"><span class="grade g-' + scoreTone(grade) + '" aria-hidden="true">' + esc(grade) + '</span><div><div class="grade-label">Sicherheitsniveau: Note ' + esc(grade) + '</div><div class="muted" style="font-size:13px">' + esc(GRADE_LABEL[grade] || '') + ' · ' + esc(posture.score) + '/100</div></div></div>';
    if (drivers.length) {
      h += '<div class="muted" style="font-size:12px;font-weight:600;margin:10px 0 6px">Größte Punktabzüge</div><ul class="drivers">' + drivers.map(function (d) {
        return '<li><span class="pts">−' + esc(d.points) + '</span><span>' + esc(d.label) + '</span></li>';
      }).join('') + '</ul>';
    } else {
      h += '<ul class="drivers"><li class="none">' + icon('ok') + ' Keine Punktabzüge</li></ul>';
    }
    h += '</div></div></div>';

    // meta
    var metaRows = [
      ['Shopsystem', esc(platformName)],
      ['Version', '<span class="mono">' + esc(version) + '</span>'],
      ['Ziel', '<span class="mono">' + esc(target) + '</span>'],
      ['Scan-Zeitpunkt', fmtDateTime(R.generated_at)]
    ];
    details.slice(0, 3).forEach(function (d) { metaRows.push([esc(d[0]), esc(d[1])]); });
    metaRows.push(['Referenzdatum', fmtDate(R.reference_date)]);
    if (R.platform && R.platform.kind !== 'hosted') metaRows.push(['Umfang', fmtNum(s.files_scanned) + ' Dateien · ' + fmtBytes(s.bytes_scanned)]);
    metaRows.push(['Dauer', fmtDuration(s.duration_ms)]);
    metaRows.push(['Vollständigkeit', s.complete ? '<span style="color:var(--ok-ink)">vollständig</span>' : '<span style="color:var(--warn-ink)">unvollständig (Zeitbudget)</span>']);
    while (metaRows.length % 4) metaRows.push(['', '']);
    h += '<dl class="card meta">' + metaRows.map(function (r) { return '<div' + (r[0] ? '' : ' class="pad"') + '><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; }).join('') + '</dl>';

    // KPI tiles
    function kpi(cls, ic, label, value, sub, action) {
      return '<button type="button" class="kpi ' + cls + (Number(value) === 0 ? ' zero' : '') + '" data-action="' + action + '"><div class="k-label">' + icon(ic) + esc(label) + '</div><div class="k-value">' + fmtNum(value) + '</div><div class="k-sub">' + sub + '</div></button>';
    }
    h += '<div class="kpis">' +
      kpi('k-crit', 'critical', 'Kritisch', counts.critical, 'sofort prüfen', 'sev:critical') +
      kpi('k-warn', 'warning', 'Warnungen', counts.warning, 'zeitnah prüfen', 'sev:warning') +
      kpi('k-info', 'info', 'Hinweise', counts.info, 'zur Kenntnis', 'sev:info') +
      kpi('k-neutral', 'accepted', 'Unbedenklich', counts.accepted, 'markiert, zählt nicht', 'accepted') +
      kpi(vulnerable ? 'k-crit' : 'k-ok', vulnerable ? 'critical' : 'ok', 'Schwachstellen', vulnerable, 'verwundbar von ' + fmtNum((R.advisories || []).length) + ' geprüften', 'go:advisories') +
      kpi(intIssues ? 'k-warn' : 'k-ok', intIssues ? 'warning' : 'ok', 'Integrität', intIssues, 'auffällig von ' + fmtNum((R.integrity || []).length) + ' Prüfpunkten', 'go:integritaet') +
      '</div>';

    // charts
    h += '<div class="grid-2" style="margin-top:16px">' +
      '<div class="card card-pad"><div class="card-head"><h3>Befunde nach Schweregrad</h3><span class="hint">Klick filtert die Befundliste</span></div><div class="chart" id="chart-sev"></div><p class="chart-note">' + plural(R.findings.length, 'Befund', 'Befunde') + ' insgesamt, davon ' + fmtNum(open.length) + ' offen. Unbedenkliche Befunde zählen weder zur Ampel noch zum Sicherheitsniveau.</p></div>' +
      '<div class="card card-pad"><div class="card-head"><h3>Offene Befunde nach Kategorie</h3><span class="hint">ohne unbedenkliche</span></div><div class="chart" id="chart-cat"></div></div>' +
      '</div>';

    // what to do now
    var top = topRecommendations(3);
    h += '<div class="card card-pad" style="margin-top:16px"><div class="card-head"><h3>Was jetzt zu tun ist</h3><a class="hint" href="#empfehlungen">Alle Handlungsempfehlungen</a></div>';
    if (top.length) {
      h += '<ol class="todo">' + top.map(function (t, i) {
        var detail = t.it.detail || '';
        if (detail.length > 240) detail = detail.slice(0, 237).replace(/\s+\S*$/, '') + ' …';
        var rel = (t.it.related || []).length;
        return '<li><div class="t-top"><span class="num">' + (i + 1) + '</span>' + prioChip(t.it.priority) + '<span class="t-group">' + esc(t.g.label) + '</span></div><b>' + esc(t.it.title) + '</b><p>' + rich(detail) + '</p>' +
          (rel ? '<a class="t-link" href="#rec-' + t.gi + '-' + t.ii + '">' + plural(rel, 'zugehöriger Befund', 'zugehörige Befunde') + '</a>' : '') + '</li>';
      }).join('') + '</ol>';
    } else {
      h += '<div class="empty">' + icon('ok') + 'Keine Maßnahmen erforderlich.</div>';
    }
    h += '</div>';

    // advisories
    h += '<div class="card" style="margin-top:16px" id="advisories"><div class="card-pad" style="padding-bottom:6px"><div class="card-head" style="margin-bottom:6px"><h3>Bekannte Schwachstellen (Advisories)</h3><span class="hint">Patch-Status mit Grundlage der Bewertung</span></div></div>';
    if ((R.advisories || []).length) {
      var advs = R.advisories.slice().sort(function (a, b) {
        var o = { vulnerable: 0, unknown: 1, patched: 2, not_affected: 3 };
        return (o[a.state] - o[b.state]) || String(a.advisory.id).localeCompare(String(b.advisory.id));
      });
      h += '<div class="tbl-wrap"><table class="adv-table"><thead><tr><th>Status</th><th>Kennung</th><th>Schwachstelle und Grundlage</th><th class="num">CVSS</th><th>Behoben in</th></tr></thead><tbody>' +
        advs.map(function (a) {
          var p = PATCH[a.state] || PATCH.unknown, ad = a.advisory || {};
          var id = ad.reference ? '<a href="' + esc(ad.reference) + '" target="_blank" rel="noopener noreferrer" class="ext">' + esc(ad.id) + icon('ext') + '</a>' : esc(ad.id);
          return '<tr><td><span class="chip s-' + p.cls + '">' + icon(p.icon) + p.label + '</span></td><td class="adv-id">' + id + '</td><td><div>' + esc(ad.title) + (ad.component ? ' <span class="muted">(' + esc(ad.component) + ')</span>' : '') + '</div><div class="adv-basis">' + rich(a.basis) + '</div></td>' +
            '<td class="num" data-label="CVSS">' + (ad.score != null ? Number(ad.score).toLocaleString('de-DE', { minimumFractionDigits: 1 }) : '–') + '</td><td class="mono" data-label="Behoben in">' + esc((ad.fixed_in || []).join(', ') || '–') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      h += '<div class="card-pad" style="padding-top:0"><div class="empty">Für diese Plattform wurden keine Advisories ausgewertet.</div></div>';
    }
    h += '</div>';
    h += '</section>';
    return h;
  }

  // ---------------------------------------------------------------- charts
  var tip = $('#tip');
  function showTip(el, text) {
    var box = el.getBoundingClientRect(), host = el.closest('.chart').getBoundingClientRect();
    var chart = el.closest('.chart');
    if (tip.parentNode !== chart) chart.appendChild(tip);
    tip.textContent = text;
    var x = box.left - host.left + box.width / 2;
    tip.style.left = Math.max(70, Math.min(host.width - 70, x)) + 'px';
    tip.style.top = (box.top - host.top - 6) + 'px';
    tip.classList.add('on');
  }
  function hideTip() { tip.classList.remove('on'); }

  // Horizontal bar chart: rows = [{label, value, color, action, tipText}]
  function barChart(el, rows, ariaLabel) {
    var W = Math.max(280, Math.round(el.clientWidth || 480));
    var CH = 6.9; // approximate width of one label character at 12.5px
    var longest = Math.max.apply(null, rows.map(function (r) { return r.label.length; }));
    var labelW = Math.round(Math.min(W * 0.46, longest * CH + 14)), valW = 40, rowH = 30, bar = 14;
    var maxChars = W * 0.46 >= longest * CH + 14 ? longest : Math.max(6, Math.floor((labelW - 14) / CH));
    rows.forEach(function (r) { r.short = r.label.length > maxChars ? r.label.slice(0, maxChars - 1) + '…' : r.label; });
    var plotW = W - labelW - valW - 8;
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return r.value; })));
    var H = rows.length * rowH + 4;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(ariaLabel) + '">';
    s += '<line class="base" x1="' + (labelW + .5) + '" x2="' + (labelW + .5) + '" y1="0" y2="' + H + '"/>';
    rows.forEach(function (r, i) {
      var y = i * rowH + 2, cy = y + rowH / 2;
      var w = r.value > 0 ? Math.max(4, plotW * r.value / max) : 0;
      var by = cy - bar / 2, x0 = labelW + 1, rad = Math.min(4, w);
      s += '<g class="row" tabindex="0" role="button" data-action="' + esc(r.action || '') + '" data-tip="' + esc(r.tipText) + '" aria-label="' + esc(r.tipText) + '">';
      s += '<rect class="hit" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" rx="6"/>';
      s += '<text x="' + (labelW - 10) + '" y="' + (cy + 4.5) + '" text-anchor="end">' + esc(r.short) + '</text>';
      if (w > 0) {
        s += '<path d="M' + x0 + ' ' + by + 'h' + (w - rad) + 'a' + rad + ' ' + rad + ' 0 0 1 ' + rad + ' ' + rad + 'v' + (bar - 2 * rad) + 'a' + rad + ' ' + rad + ' 0 0 1 -' + rad + ' ' + rad + 'h-' + (w - rad) + 'z" fill="' + r.color + '"/>';
      }
      s += '<text class="val" x="' + (x0 + w + 8) + '" y="' + (cy + 4.5) + '">' + fmtNum(r.value) + '</text>';
      s += '</g>';
    });
    s += '</svg>';
    el.innerHTML = s;
  }

  function drawCharts() {
    var sevEl = $('#chart-sev'), catEl = $('#chart-cat');
    if (!sevEl) return;
    var total = R.findings.length || 1;
    function pct(n) { return Math.round(100 * n / total) + ' %'; }
    barChart(sevEl, [
      { label: 'Kritisch', value: counts.critical, color: 'var(--crit)', action: 'sev:critical', tipText: 'Kritisch: ' + counts.critical + ' Befunde (' + pct(counts.critical) + ')' },
      { label: 'Warnung', value: counts.warning, color: 'var(--warn)', action: 'sev:warning', tipText: 'Warnung: ' + counts.warning + ' Befunde (' + pct(counts.warning) + ')' },
      { label: 'Hinweis', value: counts.info, color: 'var(--info)', action: 'sev:info', tipText: 'Hinweis: ' + counts.info + ' Befunde (' + pct(counts.info) + ')' },
      { label: 'Unbedenklich', value: counts.accepted, color: 'var(--neutral)', action: 'accepted', tipText: 'Als unbedenklich markiert: ' + counts.accepted + ' Befunde (' + pct(counts.accepted) + ')' }
    ], 'Befunde nach Schweregrad: ' + counts.critical + ' kritisch, ' + counts.warning + ' Warnungen, ' + counts.info + ' Hinweise, ' + counts.accepted + ' unbedenklich');

    var byCat = {};
    open.forEach(function (f) { byCat[f.category] = (byCat[f.category] || 0) + 1; });
    var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a] || catLabel(a).localeCompare(catLabel(b)); });
    if (!cats.length) {
      catEl.innerHTML = '<div class="empty">' + icon('ok') + 'Keine offenen Befunde.</div>';
      return;
    }
    var rows = cats.slice(0, cats.length > 8 ? 7 : 8).map(function (c) {
      return { label: catLabel(c), value: byCat[c], color: 'var(--series-1)', action: 'cat:' + c, tipText: catLabel(c) + ': ' + byCat[c] + ' offene Befunde' };
    });
    if (cats.length > 8) {
      var rest = cats.slice(7).reduce(function (n, c) { return n + byCat[c]; }, 0);
      rows.push({ label: 'Weitere (' + (cats.length - 7) + ')', value: rest, color: 'var(--neutral)', action: '', tipText: 'Weitere Kategorien: ' + rest + ' offene Befunde' });
    }
    barChart(catEl, rows, 'Offene Befunde nach Kategorie: ' + rows.map(function (r) { return r.label + ' ' + r.value; }).join(', '));
  }

  // ---------------------------------------------------------------- findings
  var state = { q: '', sev: { critical: true, warning: true, info: true }, cat: '', accepted: false, groupBy: 'severity' };
  var openSet = {};
  var savedGroup = store('ecomsec-report-group');
  if (savedGroup === 'dir' || savedGroup === 'severity') state.groupBy = savedGroup;

  function renderFindingsShell() {
    var catsAll = {};
    R.findings.forEach(function (f) { catsAll[f.category] = (catsAll[f.category] || 0) + 1; });
    var catOpts = Object.keys(catsAll).sort(function (a, b) { return catLabel(a).localeCompare(catLabel(b), 'de'); })
      .map(function (c) { return '<option value="' + esc(c) + '">' + esc(catLabel(c)) + ' (' + catsAll[c] + ')</option>'; }).join('');
    var h = '<section class="sec" id="befunde" aria-labelledby="h-f">';
    h += '<div class="sec-head"><span class="sec-no">02</span><h2 id="h-f">Befunde</h2><span class="lead">Nach Schweregrad und Kategorie. Klick auf einen Befund zeigt Details und Beweisausschnitte.</span></div>';
    h += '<div class="toolbar" role="search">' +
      '<div class="tb-row"><label class="search"><span class="sr-only">Befunde durchsuchen</span>' + icon('search') + '<input id="f-q" type="search" placeholder="Suche in Titel, Pfad, Regel, Beweis …" autocomplete="off"></label>' +
      '<label class="sr-only" for="f-cat">Kategorie</label><select id="f-cat"><option value="">Alle Kategorien</option>' + catOpts + '</select></div>' +
      '<div class="tb-row">' + SEV_ORDER.map(function (s) {
        return '<button type="button" class="sev-toggle s-' + s + '" data-sev="' + s + '" aria-pressed="true"><span class="dot"></span>' + SEV[s].label + ' <span class="n">' + counts[s] + '</span></button>';
      }).join('') +
      '<label class="check"><input type="checkbox" id="f-acc"> Unbedenkliche anzeigen (' + counts.accepted + ')</label>' +
      '<span class="tb-spacer"></span>' +
      '<div class="seg" role="group" aria-label="Gruppierung"><button type="button" data-group="severity">' + icon('layers') + 'Schweregrad</button><button type="button" data-group="dir">' + icon('folder') + 'Verzeichnis</button></div>' +
      '<button type="button" class="btn" id="f-expand">' + icon('expand') + '<span>Alle ausklappen</span></button>' +
      '</div><div class="result-count" id="f-count" aria-live="polite"></div></div>';
    h += '<div id="f-list"></div></section>';
    return h;
  }

  function matches(f) {
    if (f.accepted && !state.accepted) return false;
    if (!state.sev[f.severity]) return false;
    if (state.cat && f.category !== state.cat) return false;
    if (state.q) {
      var hay = (f.title + '\n' + f.subject + '\n' + f.rule + '\n' + (f.description || '') + '\n' + f.evidence.join('\n') + '\n' + f.id + '\n' + catLabel(f.category) + '\n' + (f.group || '')).toLowerCase();
      var terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) < 0) return false;
    }
    return true;
  }

  function findingHtml(f) {
    var sevCls = 's-' + f.severity;
    var isOpen = !!openSet[f.id];
    var badges = '';
    if (f.review) {
      var rv = REVIEW[f.review.verdict] || { label: f.review.verdict, cls: 'unknown' };
      badges += '<span class="chip s-' + rv.cls + '" title="Bewertung durch das KI-Audit">' + icon('review') + 'KI: ' + esc(rv.label) + ' (' + Math.round((f.review.confidence || 0) * 100) + ' %)</span>';
    }
    if (f.accepted) badges += '<span class="chip s-accepted">' + icon('accepted') + 'unbedenklich</span>';
    badges += '<span class="chip sevchip ' + sevCls + '">' + icon(SEV[f.severity].icon) + SEV[f.severity].label + '</span>';
    var h = '<article class="finding ' + sevCls + (f.accepted ? ' accepted' : '') + (isOpen ? ' open' : '') + '" id="f-' + esc(f.id) + '" data-id="' + esc(f.id) + '">';
    h += '<button type="button" class="f-head" aria-expanded="' + isOpen + '" aria-controls="fb-' + esc(f.id) + '">' +
      '<span class="status-ico ' + sevCls + '">' + icon(f.accepted ? 'accepted' : SEV[f.severity].icon) + '</span>' +
      '<span class="f-title">' + esc(f.title) + '</span>' +
      '<span class="f-badges">' + badges + '<svg class="icon chev" aria-hidden="true"><use href="#i-chev"/></svg></span>' +
      '<span class="f-meta"><span>' + esc(catLabel(f.category)) + '</span><span class="sep">·</span><span class="subj">' + esc(f.subject) + '</span><span class="sep">·</span><span class="f-id">' + shortId(f.id) + '</span></span>' +
      '</button>';
    h += '<div class="f-body" id="fb-' + esc(f.id) + '">';
    if (f.description) h += '<p class="f-desc">' + rich(f.description) + '</p>';
    h += '<dl class="f-dl">';
    if (f.path) h += '<dt>Pfad</dt><dd class="mono">' + esc(f.path) + '</dd>';
    else h += '<dt>Objekt</dt><dd class="mono">' + esc(f.subject) + '</dd>';
    h += '<dt>Regel</dt><dd class="mono">' + esc(f.rule) + '</dd>';
    h += '<dt>Kategorie</dt><dd>' + esc(catLabel(f.category)) + '</dd>';
    h += '<dt>Quelle</dt><dd>' + esc(SOURCE[f.source] || f.source) + '</dd>';
    h += '<dt>Befund-ID</dt><dd class="mono">' + esc(f.id) + '</dd>';
    h += '</dl>';
    if (f.evidence.length) {
      h += '<div class="ev-label">Beweis' + (f.evidence.length > 1 ? 'e (' + f.evidence.length + ')' : '') + '</div>';
      h += f.evidence.map(function (e) { return '<pre class="ev"><code>' + esc(e) + '</code></pre>'; }).join('');
    }
    if (f.review) {
      var rv2 = REVIEW[f.review.verdict] || { label: f.review.verdict, cls: 'unknown' };
      h += '<div class="review s-' + rv2.cls + '"><div class="r-head">' + icon('review') + 'KI-Bewertung: ' + esc(rv2.label) + ' (' + Math.round((f.review.confidence || 0) * 100) + ' %)<span class="r-model">' + esc(f.review.model || '') + (f.review.reviewed_at ? ' · ' + fmtDateTime(f.review.reviewed_at) : '') + '</span></div><div>' + rich(f.review.reasoning) + '</div></div>';
    }
    if (f.accepted) {
      h += '<div class="acc-note">' + icon('accepted') + '<div><b>Als unbedenklich markiert.</b> ' + (f.accepted_reason ? 'Begründung: ' + esc(f.accepted_reason) : 'Keine Begründung angegeben.') + ' Zählt nicht zur Ampel und zum Sicherheitsniveau.</div></div>';
    }
    h += '<div class="f-actions"><a href="#f-' + esc(f.id) + '" data-permalink="' + esc(f.id) + '">' + icon('link') + ' Direktlink</a>' +
      '<a href="#" data-copy="' + esc('ecomsec findings accept ' + f.id + ' --reason "…"') + '">Befehl zum Markieren kopieren</a></div>';
    h += '</div></article>';
    return h;
  }

  function sevSort(a, b) {
    return (a.accepted - b.accepted) || (SEV[a.severity].rank - SEV[b.severity].rank) || String(a.subject).localeCompare(String(b.subject));
  }

  function groupKeyDir(f) {
    if (f.group) return f.group;
    if (f.source === 'file_system') return '(Webroot)';
    return '(' + (SOURCE[f.source] || f.source) + ')';
  }

  function renderFindingsList() {
    var list = R.findings.filter(matches);
    var hiddenAcc = state.accepted ? 0 : counts.accepted;
    var cnt = $('#f-count');
    cnt.textContent = list.length + ' von ' + R.findings.length + ' Befunden angezeigt' + (hiddenAcc ? ' · ' + hiddenAcc + ' unbedenkliche ausgeblendet' : '');
    var out = '';
    if (!list.length) {
      out = '<div class="no-results">Keine Befunde für die aktuelle Auswahl.' + (R.findings.length ? ' <button type="button" class="btn" data-action="reset" style="margin-left:8px">Filter zurücksetzen</button>' : '') + '</div>';
    } else if (state.groupBy === 'severity') {
      SEV_ORDER.forEach(function (s) {
        var inSev = list.filter(function (f) { return f.severity === s; });
        if (!inSev.length) return;
        out += '<div class="f-group s-' + s + '"><div class="f-group-head"><h3>' + icon(SEV[s].icon) + SEV[s].group + '</h3><span class="count">' + inSev.length + '</span></div>';
        var byCat = {}, order = [];
        inSev.forEach(function (f) { if (!byCat[f.category]) { byCat[f.category] = []; order.push(f.category); } byCat[f.category].push(f); });
        order.sort(function (a, b) { return byCat[b].length - byCat[a].length || catLabel(a).localeCompare(catLabel(b), 'de'); });
        order.forEach(function (c) {
          out += '<div class="f-sub">' + esc(catLabel(c)) + ' <span>(' + byCat[c].length + ')</span></div><div class="f-list">' + byCat[c].sort(sevSort).map(findingHtml).join('') + '</div>';
        });
        out += '</div>';
      });
    } else {
      var groups = {}, keys = [];
      list.forEach(function (f) { var k = groupKeyDir(f); if (!groups[k]) { groups[k] = []; keys.push(k); } groups[k].push(f); });
      function worst(arr) { return Math.min.apply(null, arr.map(function (f) { return f.accepted ? 3 : SEV[f.severity].rank; })); }
      keys.sort(function (a, b) { return worst(groups[a]) - worst(groups[b]) || groups[b].length - groups[a].length || a.localeCompare(b); });
      keys.forEach(function (k) {
        var arr = groups[k].sort(sevSort), w = worst(arr), cls = w === 3 ? 's-accepted' : 's-' + SEV_ORDER[w];
        out += '<div class="f-group ' + cls + '"><div class="f-group-head"><h3>' + icon('folder') + '<span class="mono" style="font-size:15px;overflow-wrap:anywhere">' + esc(k) + '</span></h3><span class="count">' + arr.length + '</span></div><div class="f-list">' + arr.map(findingHtml).join('') + '</div></div>';
      });
    }
    if (hiddenAcc && list.length) out += '<p class="hidden-note">' + plural(hiddenAcc, 'als unbedenklich markierter Befund ist', 'als unbedenklich markierte Befunde sind') + ' ausgeblendet. <button type="button" data-action="accepted">Anzeigen</button></p>';
    var active = [];
    var off = SEV_ORDER.filter(function (k) { return !state.sev[k]; });
    if (off.length) active.push('Schweregrad: ' + SEV_ORDER.filter(function (k) { return state.sev[k]; }).map(function (k) { return SEV[k].label; }).join(', '));
    if (state.cat) active.push('Kategorie: ' + catLabel(state.cat));
    if (state.q) active.push('Suche: „' + state.q + '“');
    if (active.length) out = '<p class="print-filter">Gefilterte Ansicht (' + list.length + ' von ' + R.findings.length + ' Befunden) – ' + esc(active.join(' · ')) + '</p>' + out;
    $('#f-list').innerHTML = out;
    syncControls();
  }

  function syncControls() {
    $$('.sev-toggle').forEach(function (b) { b.setAttribute('aria-pressed', String(!!state.sev[b.getAttribute('data-sev')])); });
    $$('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-group') === state.groupBy)); });
    $('#f-acc').checked = state.accepted;
    $('#f-cat').value = state.cat;
    if ($('#f-q').value !== state.q) $('#f-q').value = state.q;
    var vis = $$('#f-list .finding');
    var allOpen = vis.length > 0 && vis.every(function (el) { return el.classList.contains('open'); });
    $('#f-expand span').textContent = allOpen ? 'Alle einklappen' : 'Alle ausklappen';
  }

  function setOpen(el, on) {
    var id = el.getAttribute('data-id');
    if (on) openSet[id] = true; else delete openSet[id];
    el.classList.toggle('open', on);
    $('.f-head', el).setAttribute('aria-expanded', String(on));
  }

  function reveal(id) {
    var f = findingsById[id];
    if (!f) return;
    if (!matches(f)) {
      state.q = ''; state.cat = '';
      state.sev = { critical: true, warning: true, info: true };
      if (f.accepted) state.accepted = true;
      renderFindingsList();
    }
    var el = document.getElementById('f-' + id);
    if (!el) return;
    setOpen(el, true);
    syncControls();
    el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    $('.f-head', el).focus({ preventScroll: true });
  }

  function goFindings() {
    var sec = document.getElementById('befunde');
    if (sec) sec.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  function applyAction(action) {
    if (!action) return;
    var parts = action.split(':'), kind = parts[0], arg = parts.slice(1).join(':');
    if (kind === 'sev') {
      state.sev = { critical: false, warning: false, info: false };
      state.sev[arg] = true; state.cat = ''; state.q = '';
      renderFindingsList(); goFindings();
    } else if (kind === 'cat') {
      state.sev = { critical: true, warning: true, info: true }; state.cat = arg; state.q = '';
      renderFindingsList(); goFindings();
    } else if (kind === 'accepted') {
      state.accepted = true; state.sev = { critical: true, warning: true, info: true }; renderFindingsList(); goFindings();
    } else if (kind === 'reset') {
      state.q = ''; state.cat = ''; state.sev = { critical: true, warning: true, info: true };
      renderFindingsList();
    } else if (kind === 'go') {
      var t = document.getElementById(arg);
      if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }

  // ---------------------------------------------------------------- integrity
  function renderIntegrity() {
    var h = '<section class="sec" id="integritaet" aria-labelledby="h-i">';
    h += '<div class="sec-head"><span class="sec-no">03</span><h2 id="h-i">Shop-Integrität</h2><span class="lead">Version, Patch-Status, Konten, Zahlung, Dateirechte und weitere Prüfpunkte.</span></div>';
    var items = R.integrity || [];
    if (!items.length) {
      return h + '<div class="card card-pad"><div class="empty">Für diesen Scan liegen keine Integritätsprüfungen vor.</div></div></section>';
    }
    var sections = [], by = {};
    items.forEach(function (it) { if (!by[it.section]) { by[it.section] = []; sections.push(it.section); } by[it.section].push(it); });
    var rank = { critical: 0, warning: 1, unknown: 2, ok: 3 };
    h += '<div class="int-grid">';
    sections.forEach(function (sec) {
      var arr = by[sec];
      var c = { critical: 0, warning: 0, ok: 0, unknown: 0 };
      arr.forEach(function (i) { c[i.status] = (c[i.status] || 0) + 1; });
      var sum = ['critical', 'warning', 'unknown', 'ok'].filter(function (k) { return c[k]; }).map(function (k) {
        return '<span class="chip s-' + k + '">' + icon(STATUS[k].icon) + c[k] + ' ' + STATUS[k].label + '</span>';
      }).join('');
      var sorted = arr.slice().sort(function (a, b) { return rank[a.status] - rank[b.status]; });
      h += '<div class="card int-card"><div class="card-head"><h3>' + esc(sec) + '</h3><div class="int-sum">' + sum + '</div></div>';
      h += sorted.map(function (i) {
        var st = STATUS[i.status] || STATUS.unknown;
        return '<div class="int-row"><span class="status-ico s-' + i.status + '" title="' + st.label + '">' + icon(st.icon) + '<span class="sr-only">' + st.label + '</span></span><div style="min-width:0"><div class="lbl">' + esc(i.label) + '</div><div class="val">' + rich(i.value) + '</div></div>' +
          (i.detail ? '<div class="det">' + rich(i.detail) + '</div>' : '') + '</div>';
      }).join('');
      h += '</div>';
    });
    h += '</div></section>';
    return h;
  }

  // ---------------------------------------------------------------- recommendations
  var DONE_KEY = 'ecomsec-report-done-' + R.generated_at;
  var done = {};
  try { done = JSON.parse(store(DONE_KEY) || '{}') || {}; } catch (e) { done = {}; }

  function refChip(id) {
    var f = findingsById[id];
    if (!f) return '<span class="ref">' + shortId(id) + '</span>';
    return '<a class="ref s-' + f.severity + '" href="#f-' + esc(id) + '" data-reveal="' + esc(id) + '" title="' + esc(f.title + ' – ' + f.subject) + '"><span class="dot"></span>' + shortId(id) + '<span class="rt">' + esc(f.subject) + '</span></a>';
  }

  function renderRecommendations() {
    var h = '<section class="sec" id="empfehlungen" aria-labelledby="h-r">';
    h += '<div class="sec-head"><span class="sec-no">04</span><h2 id="h-r">Handlungsempfehlungen</h2><span class="lead">Priorisierte Checkliste. Die Häkchen werden nur in diesem Browser gespeichert.</span></div>';
    var groups = (R.recommendations || []).filter(function (g) { return (g.items || []).length; });
    if (!groups.length) return h + '<div class="card card-pad"><div class="empty">' + icon('ok') + 'Keine Empfehlungen.</div></div></section>';
    groups.forEach(function (g) {
      var gi = R.recommendations.indexOf(g);
      h += '<div class="card rec-group"><div class="card-head"><h3>' + esc(g.label) + '</h3><span class="hint">' + plural(g.items.length, 'Punkt', 'Punkte') + '</span></div><ol class="rec-list">';
      g.items.forEach(function (it, ii) {
        var key = gi + '-' + ii, rel = it.related || [];
        var shown = rel.slice(0, 10);
        h += '<li class="rec' + (done[key] ? ' done' : '') + '" id="rec-' + key + '"><input type="checkbox" data-done="' + key + '"' + (done[key] ? ' checked' : '') + ' aria-label="Erledigt: ' + esc(it.title) + '"><div class="r-body">' +
          '<div class="r-title"><span class="t">' + esc(it.title) + '</span>' + prioChip(it.priority) + '</div>' +
          '<p class="r-detail">' + rich(it.detail) + '</p>' +
          (rel.length ? '<div class="refs">' + shown.map(refChip).join('') + (rel.length > shown.length ? '<span class="ref">+' + (rel.length - shown.length) + ' weitere</span>' : '') + '</div>' : '') +
          '</div></li>';
      });
      h += '</ol></div>';
    });
    return h + '</section>';
  }

  // ---------------------------------------------------------------- appendix
  function renderAppendix() {
    var s = R.summary || {};
    var rules = {}, ruleSev = {};
    R.findings.forEach(function (f) {
      rules[f.rule] = (rules[f.rule] || 0) + 1;
      if (!ruleSev[f.rule] || SEV[f.severity].rank < SEV[ruleSev[f.rule]].rank) ruleSev[f.rule] = f.severity;
    });
    var ruleNames = Object.keys(rules).sort(function (a, b) { return rules[b] - rules[a] || a.localeCompare(b); });
    var bySource = {};
    R.findings.forEach(function (f) { bySource[f.source] = (bySource[f.source] || 0) + 1; });

    var h = '<section class="sec" id="anhang" aria-labelledby="h-a">';
    h += '<div class="sec-head"><span class="sec-no">05</span><h2 id="h-a">Anhang</h2><span class="lead">Einschränkungen, Methodik, Glossar und rechtlicher Hinweis.</span></div>';
    h += '<div class="appx">';
    h += '<div class="card card-pad"><div class="card-head"><h3>Einschränkungen</h3></div>' +
      ((R.limitations || []).length ? '<ul>' + R.limitations.map(function (l) { return '<li>' + rich(l) + '</li>'; }).join('') + '</ul>' : '<div class="empty">' + icon('ok') + 'Alle Prüfungen wurden ausgeführt.</div>') +
      (s.complete ? '' : '<p style="margin-top:10px;color:var(--warn-ink)">Der Dateiscan ist unvollständig, weil das Zeitbudget erschöpft war. Ein erneuter Aufruf von <code>ecomsec scan</code> setzt ihn fort.</p>') + '</div>';

    h += '<div class="card card-pad"><div class="card-head"><h3>Methodik</h3></div><p class="legal">ecomsec liest die Installation ausschließlich lesend: Dateien im Webroot, die Datenbank nur mit <code>SELECT</code>-Abfragen bzw. die Shop-API nur mit <code>GET</code>. Geprüft werden bekannte Webshell-Namen (IOC-Listen), neue oder geänderte Dateien seit dem Referenzdatum, Code in Upload-Verzeichnissen, Webserver-Konfigurationen, verdächtige Code-Muster und Exploit-Payloads, öffentlich erreichbare Backups, der Patch-Status bekannter Schwachstellen sowie die Integrität von Konten, Zahlungs- und Script-Einstellungen.</p>' +
      '<dl class="f-dl" style="margin-top:10px">' +
      '<dt>Gelesene Dateien</dt><dd>' + fmtNum(s.files_scanned) + ' (' + fmtBytes(s.bytes_scanned) + ')</dd>' +
      '<dt>Laufzeit</dt><dd>' + fmtDuration(s.duration_ms) + '</dd>' +
      '<dt>Referenzdatum</dt><dd>' + fmtDate(R.reference_date) + '</dd>' +
      '<dt>Advisories geprüft</dt><dd>' + fmtNum((R.advisories || []).length) + '</dd>' +
      '<dt>Integritätspunkte</dt><dd>' + fmtNum((R.integrity || []).length) + '</dd>' +
      '<dt>Ausgelöste Regeln</dt><dd>' + fmtNum(ruleNames.length) + ' Regeln, ' + plural(R.findings.length, 'Befund', 'Befunde') + '</dd>' +
      '<dt>Herkunft</dt><dd>' + (Object.keys(bySource).map(function (k) { return esc(SOURCE[k] || k) + ' ' + bySource[k]; }).join(' · ') || '–') + '</dd>' +
      '</dl></div>';

    if (ruleNames.length) {
      h += '<div class="card" style="grid-column:1/-1"><div class="card-pad" style="padding-bottom:6px"><div class="card-head" style="margin-bottom:6px"><h3>Ausgelöste Regeln</h3><span class="hint">Anzahl Befunde je Regel</span></div></div><div class="tbl-wrap"><table><thead><tr><th>Regel</th><th>Höchster Schweregrad</th><th class="num">Befunde</th></tr></thead><tbody>' +
        ruleNames.map(function (r) {
          var sv = ruleSev[r];
          return '<tr><td class="mono" style="overflow-wrap:anywhere">' + esc(r) + '</td><td><span class="chip s-' + sv + '">' + icon(SEV[sv].icon) + SEV[sv].label + '</span></td><td class="num">' + rules[r] + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    h += '<div class="card card-pad"><div class="card-head"><h3>Glossar</h3></div><dl class="gloss">' +
      '<dt><span class="chip s-critical">' + icon('critical') + 'Kritisch</span></dt><dd>Starkes Indiz für eine Kompromittierung (Webshell, Exploit-Spur, manipulierte Konfiguration) oder eine ausnutzbare, ungepatchte Schwachstelle. Sofort prüfen.</dd>' +
      '<dt><span class="chip s-warning">' + icon('warning') + 'Warnung</span></dt><dd>Auffälligkeit, die eine Prüfung erfordert, aber oft eine harmlose Ursache hat (Updates, Deployments, offene Dateirechte, Backups).</dd>' +
      '<dt><span class="chip s-info">' + icon('info') + 'Hinweis</span></dt><dd>Information ohne direkten Handlungsbedarf, z. B. zusammengefasste Zeitstempel-Abweichungen.</dd>' +
      '<dt><span class="chip s-accepted">' + icon('accepted') + 'Unbedenklich</span></dt><dd>Vom Betreiber geprüft und mit Begründung als harmlos markiert. Zählt nicht zur Ampel und zum Sicherheitsniveau.</dd>' +
      '<dt><span class="chip">Note A–F</span></dt><dd>Sicherheitsniveau 0–100: A ab 90, B ab 75, C ab 60, D ab 40, F darunter. Offene kritische Befunde begrenzen den Wert auf höchstens 49.</dd>' +
      '<dt><span class="chip">Referenzdatum</span></dt><dd>Stichtag, ab dem neue oder geänderte Dateien als verdächtig gelten (z. B. die Veröffentlichung einer Schwachstelle).</dd>' +
      '</dl></div>';

    h += '<div class="card card-pad"><div class="card-head"><h3>Rechtlicher Hinweis</h3></div><div class="legal"><p><strong>Triage-Hilfe, keine Garantie.</strong> Dieser Bericht ist das Ergebnis eines automatisierten, rein lesenden Scans. Ein kritischer Befund ist ein klares Warnsignal; ein Ergebnis ohne Befunde ist keine Garantie dafür, dass das System nicht kompromittiert ist.</p>' +
      '<p>Signaturen, IOC-Listen und Versionsbereiche stammen aus öffentlichen Quellen und erheben keinen Anspruch auf Vollständigkeit. Bei bestätigtem Verdacht gehört eine forensische Analyse durch Fachleute dazu; bei möglichem Abfluss personenbezogener Daten gilt die Meldepflicht nach Art. 33 DSGVO (72 Stunden).</p>' +
      '<p class="muted" style="margin:0">Der Bericht enthält Pfade, Konfigurationsausschnitte und Kontennamen. Nur an berechtigte Personen weitergeben.</p></div></div>';
    h += '</div></section>';
    return h;
  }

  // ---------------------------------------------------------------- theme
  var THEMES = ['system', 'light', 'dark'];
  var THEME_LABEL = { system: 'System', light: 'Hell', dark: 'Dunkel' };
  var THEME_ICON = { system: 'system', light: 'sun', dark: 'moon' };
  function applyTheme(t) {
    if (THEMES.indexOf(t) < 0) t = 'system';
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    var b = $('#theme-btn');
    b.innerHTML = icon(THEME_ICON[t]) + '<span class="lbl">' + THEME_LABEL[t] + '</span>';
    b.setAttribute('aria-label', 'Darstellung: ' + THEME_LABEL[t] + ' (wechseln)');
    b.dataset.theme = t;
  }

  // ---------------------------------------------------------------- print
  function setupPrint() {
    var label = (platformName + ' · ' + target).replace(/["\\]/g, '');
    var date = fmtDateTime(R.generated_at).replace(/["\\]/g, '');
    var st = document.createElement('style');
    st.textContent = '@page{@top-left{content:"ecomsec Sicherheitsbericht · ' + label.slice(0, 90) + '";font:9px system-ui,sans-serif;color:#5f6878}' +
      '@top-right{content:"' + date + '";font:9px system-ui,sans-serif;color:#5f6878}' +
      '@bottom-right{content:"Seite " counter(page) " von " counter(pages);font:9px system-ui,sans-serif;color:#5f6878}' +
      '@bottom-left{content:"Vertraulich – Triage-Hilfe, keine Garantie";font:9px system-ui,sans-serif;color:#5f6878}}';
    document.head.appendChild(st);
    var before = null;
    window.addEventListener('beforeprint', function () {
      before = $$('.finding.open').map(function (el) { return el.getAttribute('data-id'); });
      $$('.finding').forEach(function (el) { el.classList.add('open'); });
    });
    window.addEventListener('afterprint', function () {
      if (!before) return;
      $$('.finding').forEach(function (el) { el.classList.toggle('open', before.indexOf(el.getAttribute('data-id')) >= 0); });
      before = null;
    });
  }

  // ---------------------------------------------------------------- boot
  document.title = 'Sicherheitsbericht ' + platformName + ' – ' + target + ' – ' + fmtDate(String(R.generated_at).slice(0, 10));
  $('#app').innerHTML = renderSummary() + renderFindingsShell() + renderIntegrity() + renderRecommendations() + renderAppendix();
  $('#foot').innerHTML = '<span>Erstellt mit ' + esc(META.generator || 'ecomsec') + ' · Scan ' + fmtDateTime(R.generated_at) + ' · Schema v' + esc(R.schema_version) + '</span><span>Eigenständige Datei – keine externen Verbindungen. Triage-Hilfe, keine Garantie.</span>';
  renderFindingsList();
  drawCharts();
  applyTheme(store('ecomsec-report-theme') || document.documentElement.getAttribute('data-theme') || 'system');
  setupPrint();

  if ('ResizeObserver' in window) {
    var last = 0;
    new ResizeObserver(function (entries) {
      var w = Math.round(entries[0].contentRect.width);
      if (Math.abs(w - last) > 4) { last = w; drawCharts(); }
    }).observe($('#chart-sev'));
  }

  // events
  var qTimer = null;
  $('#f-q').addEventListener('input', function (e) {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = e.target.value.trim(); renderFindingsList(); }, 120);
  });
  $('#f-cat').addEventListener('change', function (e) { state.cat = e.target.value; renderFindingsList(); });
  $('#f-acc').addEventListener('change', function (e) { state.accepted = e.target.checked; renderFindingsList(); });
  $('#f-expand').addEventListener('click', function () {
    var vis = $$('#f-list .finding');
    var allOpen = vis.length > 0 && vis.every(function (el) { return el.classList.contains('open'); });
    vis.forEach(function (el) { setOpen(el, !allOpen); });
    syncControls();
  });
  $('#theme-btn').addEventListener('click', function () {
    var cur = this.dataset.theme || 'system';
    var next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    applyTheme(next);
    store('ecomsec-report-theme', next === 'system' ? null : next);
  });
  $('#print-btn').addEventListener('click', function () { window.print(); });

  document.addEventListener('click', function (e) {
    var t = e.target;
    var sevBtn = t.closest('.sev-toggle');
    if (sevBtn) { var s = sevBtn.getAttribute('data-sev'); state.sev[s] = !state.sev[s]; renderFindingsList(); return; }
    var segBtn = t.closest('.seg button');
    if (segBtn) { state.groupBy = segBtn.getAttribute('data-group'); store('ecomsec-report-group', state.groupBy); renderFindingsList(); return; }
    var head = t.closest('.f-head');
    if (head) { var art = head.closest('.finding'); setOpen(art, !art.classList.contains('open')); syncControls(); return; }
    var rev = t.closest('[data-reveal]');
    if (rev) { e.preventDefault(); reveal(rev.getAttribute('data-reveal')); history.replaceState(null, '', '#f-' + rev.getAttribute('data-reveal')); return; }
    var perma = t.closest('[data-permalink]');
    if (perma) { e.preventDefault(); history.replaceState(null, '', '#f-' + perma.getAttribute('data-permalink')); return; }
    var copy = t.closest('[data-copy]');
    if (copy) {
      e.preventDefault();
      var text = copy.getAttribute('data-copy');
      var ok = function () { var o = copy.textContent; copy.textContent = 'Kopiert'; setTimeout(function () { copy.textContent = o; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { window.prompt('Befehl kopieren:', text); });
      else window.prompt('Befehl kopieren:', text);
      return;
    }
    var act = t.closest('[data-action]');
    if (act) { applyAction(act.getAttribute('data-action')); return; }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.chart .row')) {
      e.preventDefault(); applyAction(e.target.getAttribute('data-action'));
    }
    if (e.key === '/' && document.activeElement && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
      e.preventDefault(); $('#f-q').focus();
    }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-done');
    if (k == null) return;
    if (e.target.checked) done[k] = 1; else delete done[k];
    e.target.closest('.rec').classList.toggle('done', e.target.checked);
    store(DONE_KEY, JSON.stringify(done));
  });
  ['mouseover', 'focusin'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      var row = e.target.closest && e.target.closest('.chart .row');
      if (row) showTip(row.querySelector('path') || row, row.getAttribute('data-tip'));
    });
  });
  ['mouseout', 'focusout'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (e.target.closest && e.target.closest('.chart .row')) hideTip();
    });
  });

  if (/^#f-[0-9a-f]+$/i.test(location.hash)) {
    var id = location.hash.slice(3);
    setTimeout(function () { reveal(id); }, 50);
  }
})();
</script>
</body>
</html>
