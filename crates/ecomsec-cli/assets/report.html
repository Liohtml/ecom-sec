<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="ecomsec">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>ecomsec Sicherheitsbericht</title>
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  color-scheme:light;
  --page:#f4f5f7;--surface:#ffffff;--surface-2:#f6f7f9;--surface-3:#eceef2;
  --ink:#111827;--ink-2:#374151;--muted:#5f6878;--line:#e3e6eb;--line-2:#cfd4dc;
  --accent:#1d4ed8;--accent-2:#1e40af;--accent-bg:#eef3ff;--focus:#2563eb;
  --crit:#d03b3b;--crit-ink:#b42318;--crit-bg:#fdf0ef;--crit-line:#f4c7c3;
  --warn:#e8a300;--warn-ink:#8a4b00;--warn-bg:#fff6e5;--warn-line:#f5d9a3;
  --ok:#15a34a;--ok-ink:#11652f;--ok-bg:#ecf8f0;--ok-line:#bfe5cc;
  --info:#2a78d6;--info-ink:#1c5cab;--info-bg:#edf4fd;--info-line:#c4daf6;
  --neutral:#9aa1ab;--neutral-ink:#4b5563;--neutral-bg:#f0f2f5;--neutral-line:#d8dce2;
  --series-1:#2a78d6;--grid:#e6e8ec;
  --code-bg:#f3f4f7;--code-ink:#1f2937;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 4px 18px rgba(16,24,40,.08);
  --housing:#1f2430;
  --radius:12px;--radius-sm:8px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0b0e13;--surface:#141920;--surface-2:#1a2029;--surface-3:#222934;
    --ink:#eef1f5;--ink-2:#cdd3dc;--muted:#9aa4b2;--line:#262e39;--line-2:#36404d;
    --accent:#8fb4ff;--accent-2:#b3cbff;--accent-bg:#17233b;--focus:#8fb4ff;
    --crit:#e5534b;--crit-ink:#ff9b91;--crit-bg:#2b1517;--crit-line:#5a2626;
    --warn:#fab219;--warn-ink:#f7c766;--warn-bg:#2a2111;--warn-line:#5a4519;
    --ok:#2fb463;--ok-ink:#7ddca3;--ok-bg:#112619;--ok-line:#235236;
    --info:#3987e5;--info-ink:#97c0f5;--info-bg:#13213a;--info-line:#24406b;
    --neutral:#6b7482;--neutral-ink:#b3bbc6;--neutral-bg:#1e242d;--neutral-line:#353e4a;
    --series-1:#3987e5;--grid:#262e39;
    --code-bg:#0f1318;--code-ink:#dfe4ea;
    --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 6px 22px rgba(0,0,0,.35);
    --housing:#0a0c10;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0b0e13;--surface:#141920;--surface-2:#1a2029;--surface-3:#222934;
  --ink:#eef1f5;--ink-2:#cdd3dc;--muted:#9aa4b2;--line:#262e39;--line-2:#36404d;
  --accent:#8fb4ff;--accent-2:#b3cbff;--accent-bg:#17233b;--focus:#8fb4ff;
  --crit:#e5534b;--crit-ink:#ff9b91;--crit-bg:#2b1517;--crit-line:#5a2626;
  --warn:#fab219;--warn-ink:#f7c766;--warn-bg:#2a2111;--warn-line:#5a4519;
  --ok:#2fb463;--ok-ink:#7ddca3;--ok-bg:#112619;--ok-line:#235236;
  --info:#3987e5;--info-ink:#97c0f5;--info-bg:#13213a;--info-line:#24406b;
  --neutral:#6b7482;--neutral-ink:#b3bbc6;--neutral-bg:#1e242d;--neutral-line:#353e4a;
  --series-1:#3987e5;--grid:#262e39;
  --code-bg:#0f1318;--code-ink:#dfe4ea;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 6px 22px rgba(0,0,0,.35);
  --housing:#0a0c10;
}

/* ------------------------------------------------------------------ base */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 var(--sans);overflow-x:hidden}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{line-height:1.25;margin:0;color:var(--ink)}
p{margin:0 0 .6em}
code,pre,.mono{font-family:var(--mono);font-size:.86em}
code{background:var(--code-bg);color:var(--code-ink);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em}
.muted{color:var(--muted)}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* ------------------------------------------------------------------ top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.brand-mark .icon{width:18px;height:18px}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500;padding:6px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.top-actions{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.icon-only{padding:7px 9px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ------------------------------------------------------------------ layout */
main{max-width:1160px;margin:0 auto;padding:28px 20px 40px}
.doc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.doc-head h1{font-size:28px;letter-spacing:-.02em}
.doc-head .sub{color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.doc-head .stamp{font-size:13px;color:var(--muted);text-align:right}
.doc-head .stamp b{color:var(--ink-2);font-weight:600}
section.sec{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
.sec-head h2{font-size:21px;letter-spacing:-.015em}
.sec-no{font:600 12px/1 var(--mono);color:var(--muted);background:var(--surface-3);padding:5px 7px;border-radius:6px;align-self:center}
.sec-head .lead{color:var(--muted);font-size:14px;margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card h3{font-size:15px}
.card-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.card-head .hint{font-size:12.5px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:16px}

/* ------------------------------------------------------------------ hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--v)}
.hero.v-critical{--v:var(--crit);--v-bg:var(--crit-bg);--v-ink:var(--crit-ink)}
.hero.v-warning{--v:var(--warn);--v-bg:var(--warn-bg);--v-ink:var(--warn-ink)}
.hero.v-clean{--v:var(--ok);--v-bg:var(--ok-bg);--v-ink:var(--ok-ink)}
.hero-main{padding:24px 24px 22px 30px;display:flex;gap:22px;align-items:flex-start;background:linear-gradient(135deg,var(--v-bg),transparent 70%)}
.light{flex:none;width:44px;padding:7px 0;border-radius:22px;background:var(--housing);display:grid;gap:7px;justify-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.18)}
.light i{display:block;width:26px;height:26px;border-radius:50%;opacity:.2}
.light i.r{background:#ef4444}.light i.y{background:#f5b301}.light i.g{background:#22c55e}
.light i.on{opacity:1;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 0 14px 2px currentColor}
.light i.r.on{color:rgba(239,68,68,.65)}.light i.y.on{color:rgba(245,179,1,.6)}.light i.g.on{color:rgba(34,197,94,.6)}
.verdict-kicker{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--v-ink);display:flex;align-items:center;gap:6px}
.verdict-title{font-size:26px;letter-spacing:-.02em;margin:8px 0 8px}
.verdict-text{color:var(--ink-2);max-width:56ch;margin:0}
.counts-inline{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-score{border-left:1px solid var(--line);padding:22px 24px;display:flex;gap:20px;align-items:center}
.ring{flex:none;position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .score-num{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring .score-of{font-size:12px;color:var(--muted);margin-top:3px}
.grade-line{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.grade{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;font-weight:800;font-size:18px;color:#fff}
.grade.g-ok{background:#15803d}.grade.g-warn{background:#b45309}.grade.g-crit{background:#b42318}
.grade-label{font-weight:600}
.drivers{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.drivers li{display:flex;gap:8px;align-items:baseline}
.drivers .pts{font:600 12px/1.4 var(--mono);color:var(--crit-ink);background:var(--crit-bg);border-radius:5px;padding:0 6px;flex:none;min-width:38px;text-align:center}
.drivers .none{color:var(--ok-ink)}

/* ------------------------------------------------------------------ meta + kpis */
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:16px}
.meta div{padding:12px 16px;border-right:1px solid var(--line);border-top:1px solid var(--line);min-width:0}
.meta div:nth-child(4n){border-right:0}
.meta div:nth-child(-n+4){border-top:0}
.meta dt{font-size:12px;color:var(--muted);margin-bottom:2px}
.meta dd{margin:0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.meta dd .mono{font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px}
.kpi{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 13px;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.kpi:hover{border-color:var(--line-2);box-shadow:var(--shadow-lg)}
.kpi::after{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--k,var(--line-2))}
.kpi .k-label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .k-label .icon{color:var(--k-ink,var(--muted))}
.kpi .k-value{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.k-crit{--k:var(--crit);--k-ink:var(--crit-ink)}.kpi.k-warn{--k:var(--warn);--k-ink:var(--warn-ink)}.kpi.k-info{--k:var(--info);--k-ink:var(--info-ink)}.kpi.k-ok{--k:var(--ok);--k-ink:var(--ok-ink)}.kpi.k-neutral{--k:var(--neutral);--k-ink:var(--neutral-ink)}
.kpi.zero .k-value{color:var(--muted)}

/* ------------------------------------------------------------------ chips, badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--c-line,var(--line));background:var(--c-bg,var(--surface-2));color:var(--c-ink,var(--ink-2));white-space:nowrap}
.chip .icon{width:13px;height:13px}
.s-critical{--c:var(--crit);--c-ink:var(--crit-ink);--c-bg:var(--crit-bg);--c-line:var(--crit-line)}
.s-warning{--c:var(--warn);--c-ink:var(--warn-ink);--c-bg:var(--warn-bg);--c-line:var(--warn-line)}
.s-info{--c:var(--info);--c-ink:var(--info-ink);--c-bg:var(--info-bg);--c-line:var(--info-line)}
.s-ok{--c:var(--ok);--c-ink:var(--ok-ink);--c-bg:var(--ok-bg);--c-line:var(--ok-line)}
.s-unknown,.s-accepted{--c:var(--neutral);--c-ink:var(--neutral-ink);--c-bg:var(--neutral-bg);--c-line:var(--neutral-line)}
.chip.big{font-size:13px;padding:6px 10px}
.status-ico{display:inline-grid;place-items:center;color:var(--c-ink)}
.status-ico .icon{width:18px;height:18px}

/* ------------------------------------------------------------------ charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink-2);font-size:12.5px}
.chart .val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart .row{cursor:pointer;outline:none}
.chart .row .hit{fill:transparent}
.chart .row:hover .hit,.chart .row:focus-visible .hit{fill:var(--surface-3)}
.chart .track{fill:var(--surface-3)}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart-note{font-size:12.5px;color:var(--muted);margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;box-shadow:var(--shadow-lg);z-index:5}
.tip.on{opacity:1}

/* ------------------------------------------------------------------ todo list (summary) */
.todo{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.todo li{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 14px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.todo .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);font-weight:700;font-size:12.5px;flex:none}
.todo .t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .t-group{font-size:12px;color:var(--muted);font-weight:600}
.todo b{font-size:14.5px;line-height:1.35}
.todo p{font-size:13.5px;color:var(--ink-2);margin:0}
.todo .t-link{font-size:13px;margin-top:auto}
.empty{color:var(--muted);font-size:14px;padding:6px 0;display:flex;gap:8px;align-items:center}
.empty .icon{color:var(--ok-ink)}

/* ------------------------------------------------------------------ tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.adv-id{font-family:var(--mono);font-size:13px;white-space:nowrap;font-weight:600}
.adv-basis{color:var(--ink-2);font-size:13px;margin-top:3px}
.ext .icon{width:12px;height:12px;margin-left:2px}

/* ------------------------------------------------------------------ findings toolbar */
.toolbar{position:sticky;top:57px;z-index:10;background:var(--page);padding:10px 0 12px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tb-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 240px;min-width:0}
.search .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}
select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.sev-toggle{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);cursor:pointer}
.sev-toggle .dot{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.35}
.sev-toggle[aria-pressed="true"]{background:var(--c-bg);border-color:var(--c-line);color:var(--c-ink)}
.sev-toggle[aria-pressed="true"] .dot{opacity:1}
.sev-toggle .n{font-variant-numeric:tabular-nums;opacity:.85}
.check{display:inline-flex;gap:7px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 11px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.tb-spacer{flex:1}
.result-count{font-size:13px;color:var(--muted)}

/* ------------------------------------------------------------------ findings */
.f-group{margin-bottom:26px}
.f-group-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.f-group-head h3{font-size:17px;display:flex;align-items:center;gap:8px}
.f-group-head h3 .icon{color:var(--c-ink);width:19px;height:19px}
.f-group-head .count{font:600 12.5px/1 var(--sans);color:var(--c-ink,var(--muted));background:var(--c-bg,var(--surface-3));border:1px solid var(--c-line,var(--line));padding:4px 8px;border-radius:999px}
.f-sub{margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;text-transform:none}
.f-sub::after{content:"";flex:1;height:1px;background:var(--line)}
.f-list{display:grid;gap:8px}
.finding{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--radius-sm);box-shadow:var(--shadow);scroll-margin-top:150px}
.finding.accepted{border-left-color:var(--neutral);background:var(--surface-2);box-shadow:none}
.finding.accepted .f-title{color:var(--ink-2);font-weight:500}
.finding.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--focus)}100%{box-shadow:var(--shadow)}}
.f-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;width:100%;padding:12px 14px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:var(--radius-sm)}
.f-head:hover .f-title{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.f-head .chev{color:var(--muted);transition:transform .15s;margin-top:2px}
.finding.open .f-head .chev{transform:rotate(180deg)}
.f-title{font-weight:600;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.f-meta{grid-column:2/3;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);align-items:center;min-width:0}
.f-meta .subj{font-family:var(--mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;min-width:0}
.f-meta .sep{opacity:.5}
.f-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.f-id{font:500 11.5px/1 var(--mono);color:var(--muted)}
.f-body{display:none;padding:2px 16px 16px 16px;border-top:1px dashed var(--line);margin:0 14px 0 14px;padding-left:0;padding-right:0}
.finding.open .f-body{display:block}
.f-desc{margin:12px 0 10px;color:var(--ink-2);font-size:14px;max-width:90ch}
.f-dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px;margin:0 0 10px}
.f-dl dt{color:var(--muted)}
.f-dl dd{margin:0;overflow-wrap:anywhere}
.ev-label{font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
pre.ev{margin:0 0 6px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
.review{margin-top:10px;border:1px solid var(--c-line,var(--line));background:var(--c-bg,var(--surface-2));border-radius:8px;padding:10px 12px;font-size:13.5px}
.review .r-head{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--c-ink,var(--ink));margin-bottom:4px;flex-wrap:wrap}
.review .r-model{font-weight:400;color:var(--muted);font-size:12px}
.acc-note{margin-top:10px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.acc-note .icon{margin-top:3px}
.f-actions{display:flex;gap:12px;margin-top:10px;font-size:12.5px}
.f-actions a{color:var(--muted)}
.no-results{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius)}
.hidden-note{font-size:13px;color:var(--muted);margin-top:10px}
.hidden-note button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

/* ------------------------------------------------------------------ integrity */
.int-grid{columns:2;column-gap:16px}
.int-card{overflow:hidden;break-inside:avoid;margin-bottom:16px;display:inline-block;width:100%}
.int-card .card-head{padding:14px 18px 0;margin-bottom:10px}
.int-sum{display:flex;gap:6px;flex-wrap:wrap}
.int-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 10px;padding:10px 18px;border-top:1px solid var(--line)}
.int-row .lbl{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.int-row .val{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.int-row .det{grid-column:2/3;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

/* ------------------------------------------------------------------ recommendations */
.rec-group{margin-bottom:18px}
.rec-group .card-head{padding:16px 20px 0}
.rec-list{list-style:none;margin:0;padding:0 0 6px;counter-reset:rec}
.rec{display:grid;grid-template-columns:28px 22px minmax(0,1fr);gap:4px 10px;padding:12px 20px;border-top:1px solid var(--line);counter-increment:rec}
.rec:first-child{border-top:0}
.rec::before{content:counter(rec) ".";font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.rec input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--ok)}
.rec .r-body{min-width:0}
.rec .r-title{font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec.done .r-title span.t{text-decoration:line-through;color:var(--muted)}
.rec .r-detail{color:var(--ink-2);font-size:14px;margin:4px 0 0;max-width:95ch}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ref{font:500 12px/1 var(--mono);text-decoration:none;padding:5px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;max-width:100%}
.ref:hover{border-color:var(--accent);color:var(--accent)}
.ref .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--neutral));flex:none}
.ref .rt{font-family:var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30ch}
.prio{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:5px;letter-spacing:.02em}
.prio.p1{background:var(--crit-bg);color:var(--crit-ink);border:1px solid var(--crit-line)}
.prio.p2{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.prio.p3{background:var(--info-bg);color:var(--info-ink);border:1px solid var(--info-line)}

/* ------------------------------------------------------------------ appendix */
.appx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.appx ul{margin:0;padding-left:20px}
.appx li{margin:4px 0}
.gloss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;margin:0;font-size:14px;align-items:start}
.gloss dd{margin:0;color:var(--ink-2)}
.legal{font-size:13.5px;color:var(--ink-2)}
.legal strong{color:var(--ink)}
footer.foot{max-width:1160px;margin:0 auto;padding:20px 20px 40px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}
.print-only{display:none}
.print-filter{display:none}

/* ------------------------------------------------------------------ responsive */
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .meta div{border-top:1px solid var(--line)!important;border-right:1px solid var(--line)!important}
  .meta div:nth-child(2n){border-right:0!important}
  .meta div:nth-child(-n+2){border-top:0!important}
  .meta div.pad{display:none}
  .todo{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-score{border-left:0;border-top:1px solid var(--line)}
  .grid-2,.appx{grid-template-columns:minmax(0,1fr)}
  .int-grid{columns:1}
  .nav{display:none}
  .top-actions{margin-left:auto}
}
@media (max-width:560px){
  main{padding:18px 16px 32px}
  .topbar-in{padding:8px 16px;gap:10px}
  .brand small{display:none}
  .btn .lbl{display:none}
  .doc-head h1{font-size:23px}
  .doc-head .stamp{text-align:left}
  .hero-main{padding:18px 16px 18px 22px;gap:14px}
  .light{width:36px;gap:6px;padding:6px 0}.light i{width:20px;height:20px}
  .verdict-title{font-size:21px}
  .hero-score{padding:18px 16px;flex-direction:column;align-items:flex-start}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .k-value{font-size:24px}
  .meta div{padding:10px 12px}
  .card-pad{padding:16px}
  .toolbar{position:static}
  .f-badges .sevchip{display:none}
  .adv-table td[data-label]::before{content:attr(data-label) ": ";color:var(--muted);font-family:var(--sans);font-size:12px}
  .adv-table td.num{text-align:left}
  .f-head{grid-template-columns:auto minmax(0,1fr);padding:12px}
  .f-head .f-badges{grid-column:2/3;justify-content:flex-start}
  .f-head .chev{display:none}
  .f-body{margin:0 12px}
  .rec{grid-template-columns:22px minmax(0,1fr);padding:12px 16px}
  .rec::before{display:none}
  .int-row{padding:10px 14px}
  .sec-head .lead{margin-left:0;width:100%}
  th,td{padding:8px 9px}
  .adv-table thead{display:none}
  .adv-table tr{display:grid;grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--line);padding:6px 0}
  .adv-table td{border:0;padding:3px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ------------------------------------------------------------------ print */
@page{size:A4;margin:18mm 14mm 16mm}
@media print{
  :root,:root[data-theme="dark"]{
    color-scheme:light;
    --page:#fff;--surface:#fff;--surface-2:#f6f7f9;--surface-3:#eceef2;
    --ink:#111827;--ink-2:#374151;--muted:#5f6878;--line:#dfe2e7;--line-2:#cfd4dc;
    --accent:#1d4ed8;--accent-2:#1e40af;--accent-bg:#eef3ff;
    --crit:#d03b3b;--crit-ink:#b42318;--crit-bg:#fdf0ef;--crit-line:#f4c7c3;
    --warn:#e8a300;--warn-ink:#8a4b00;--warn-bg:#fff6e5;--warn-line:#f5d9a3;
    --ok:#15a34a;--ok-ink:#11652f;--ok-bg:#ecf8f0;--ok-line:#bfe5cc;
    --info:#2a78d6;--info-ink:#1c5cab;--info-bg:#edf4fd;--info-line:#c4daf6;
    --neutral:#9aa1ab;--neutral-ink:#4b5563;--neutral-bg:#f0f2f5;--neutral-line:#d8dce2;
    --series-1:#2a78d6;--code-bg:#f3f4f7;--code-ink:#1f2937;--shadow:none;--shadow-lg:none;--housing:#1f2430;
  }
  html,body{background:#fff;font-size:12.5px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,.toolbar,.no-print,.f-actions,.skip,.tip,.hidden-note button{display:none!important}
  .print-only{display:block}
  main{max-width:none;padding:0}
  section.sec{margin-top:0;break-before:page}
  section.sec#zusammenfassung{break-before:auto}
  .sec-head{break-after:avoid}
  .card,.finding,.kpi{box-shadow:none}
  .finding .f-body{display:block}
  .finding .chev{display:none}
  .finding,.int-row,.rec,.todo li,tr,.kpi,.hero,.review{break-inside:avoid}
  .f-group-head,.f-sub,.card-head{break-after:avoid}
  pre.ev{max-height:none;overflow:visible}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px}
  .kpi .k-value{font-size:22px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-score{border-left:0;border-top:1px solid var(--line);padding:16px 24px}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2>.card,.chart,.kpis,.meta{break-inside:avoid}
  .appx{grid-template-columns:minmax(0,1fr)}
  .appx>.card{break-inside:avoid}
  .int-grid{columns:2}
  .todo{grid-template-columns:repeat(3,minmax(0,1fr))}
  .meta div{padding:8px 12px}
  .print-filter{display:block;margin:0 0 12px;font-size:12px;color:var(--warn-ink);border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:6px;padding:6px 10px}
  a{color:inherit;text-decoration:none}
  .rec input{appearance:none;-webkit-appearance:none;border:1.5px solid #6b7280;border-radius:3px;width:13px;height:13px}
  footer.foot{border-top:1px solid var(--line);padding:10px 0 0}
}

(function () {
  'use strict';
  // The report data is embedded by `ecomsec` at export time.  Repeated

  var PACK = __REPORT_JSON__;

  var R = PACK.report;
  var STR = PACK.strings || [];
  var META = PACK.meta || {};
  var INTERNED = ['title', 'description', 'rule', 'group'];
  var ROOT = R.platform && R.platform.root ? String(R.platform.root).replace(/[\/\\]+$/, '') : '';
  R.findings.forEach(function (f) {
    INTERNED.forEach(function (k) { if (typeof f[k] === 'number') f[k] = STR[f[k]]; });
    if (f._p) { f.path = ROOT + '/' + f.subject; delete f._p; }
    if (!f.evidence) f.evidence = [];
    f.accepted = !!f.accepted;
  });

  // ---------------------------------------------------------------- helpers
  var $ = function (sel, el) { return (el || document).querySelector(sel); };
  var $$ = function (sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Escape and render `inline code` spans.
  function rich(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function icon(name, extra) { return '<svg class="icon' + (extra ? ' ' + extra : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return pad(d.getUTCDate()) + '.' + pad(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear() + ', ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ' UTC';
  }
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? m[3] + '.' + m[2] + '.' + m[1] : esc(s || '–');
  }
  function fmtNum(n) { return Number(n || 0).toLocaleString('de-DE'); }
  function fmtBytes(b) {
    b = Number(b || 0);
    var u = ['B', 'KiB', 'MiB', 'GiB', 'TiB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i ? b.toLocaleString('de-DE', { maximumFractionDigits: 1 }) : b) + ' ' + u[i];
  }
  function fmtDuration(ms) {
    ms = Number(ms || 0);
    if (ms < 1000) return ms + ' ms';
    var s = ms / 1000;
    if (s < 60) return s.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' s';
    return Math.floor(s / 60) + ' min ' + Math.round(s % 60) + ' s';
  }
  function plural(n, one, many) { return fmtNum(n) + ' ' + (n === 1 ? one : many); }
  function store(key, val) {
    try {

      if (val === null) window.localStorage.removeItem(key); else window.localStorage.setItem(key, val);
    } catch (e) { /* storage unavailable (file://, private mode) */ }
    return null;
  }

  var SEV = {
    critical: { label: 'Kritisch', group: 'Kritische Befunde', icon: 'critical', rank: 0 },
    warning: { label: 'Warnung', group: 'Warnungen', icon: 'warning', rank: 1 },
    info: { label: 'Hinweis', group: 'Hinweise', icon: 'info', rank: 2 }
  };
  var SEV_ORDER = ['critical', 'warning', 'info'];
  var SOURCE = { file_system: 'Dateisystem', database: 'Datenbank', api: 'API', configuration: 'Konfiguration', scanner: 'Scanner', access_log: 'Webserver-Log' };
  var STATUS = {

  };
  var PATCH = {
