<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>ecomsec Dashboard</title>
<script>
// Apply theme and sidebar state before the first paint (no flash).
(function () {
  var d = document.documentElement, q = new URLSearchParams(location.search), t = null, c = null;
  try { t = localStorage.getItem("ecomsec-theme"); c = localStorage.getItem("ecomsec-nav-collapsed"); } catch (e) {}
  t = q.get("theme") || t;
  if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
  if (c === "1") d.setAttribute("data-nav", "collapsed");
})();
</script>
<link rel="stylesheet" href="app.css?v=__VERSION__">
</head>

<a class="skip-link" href="#main">Zum Inhalt springen</a>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Seitenleiste">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-shield"/></svg></span>
      <span class="brand-text"><b>ecomsec</b><small>Kompromittierungs-Check</small></span>
    </div>
    <nav class="nav" aria-label="Hauptnavigation" id="nav">
      <a href="#/overview" data-view="overview"><svg class="icon"><use href="#i-overview"/></svg><span class="nav-label">Übersicht</span></a>
      <a href="#/findings" data-view="findings"><svg class="icon"><use href="#i-findings"/></svg><span class="nav-label">Befunde</span><span class="nav-badge" data-badge="findings" hidden></span></a>
      <a href="#/integrity" data-view="integrity"><svg class="icon"><use href="#i-shield"/></svg><span class="nav-label">Shop-Integrität</span><span class="nav-badge" data-badge="integrity" hidden></span></a>
      <a href="#/recommendations" data-view="recommendations"><svg class="icon"><use href="#i-checklist"/></svg><span class="nav-label">Empfehlungen</span><span class="nav-badge" data-badge="recommendations" hidden></span></a>
      <a href="#/history" data-view="history"><svg class="icon"><use href="#i-history"/></svg><span class="nav-label">Verlauf</span></a>
      <a href="#/audit" data-view="audit"><svg class="icon"><use href="#i-ai"/></svg><span class="nav-label">KI-Audit</span><span class="nav-badge" data-badge="audit" hidden></span></a>
      <div class="nav-sep" role="separator"></div>
      <a href="#/settings" data-view="settings"><svg class="icon"><use href="#i-settings"/></svg><span class="nav-label">Einstellungen &amp; Hilfe</span></a>
    </nav>
    <div class="sidebar-foot">
      <button type="button" class="nav-collapse" id="navCollapse" aria-label="Seitenleiste einklappen" title="Seitenleiste ein-/ausklappen">
        <svg class="icon"><use href="#i-sidebar"/></svg><span class="nav-label">Einklappen</span>
      </button>
      <div class="sidebar-meta nav-label">read-only · offline · v__VERSION__</div>
    </div>
  </aside>
  <div class="scrim" id="navScrim" hidden></div>

  <div class="main-col">
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn only-mobile" id="navOpen" aria-label="Navigation öffnen" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="target" id="target">
        <span class="target-icon" aria-hidden="true"><svg class="icon"><use href="#i-server"/></svg></span>
        <span class="target-text"><b id="targetName">ecomsec</b><small id="targetMeta">Lade Daten …</small></span>
      </div>
      <div class="topbar-actions">
        <a class="score-chip" id="scoreChip" href="#/overview" hidden></a>
        <button type="button" class="btn btn-primary scan-btn" id="scanBtn">
          <svg class="icon"><use href="#i-scan"/></svg><span class="scan-label">Scan starten</span>
        </button>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Farbschema umschalten" title="Hell/Dunkel (t)">
          <svg class="icon theme-dark-icon"><use href="#i-moon"/></svg><svg class="icon theme-light-icon"><use href="#i-sun"/></svg>
        </button>
        <button type="button" class="icon-btn hide-mobile" id="helpBtn" aria-label="Tastenkürzel anzeigen" title="Tastenkürzel (?)"><svg class="icon"><use href="#i-keyboard"/></svg></button>
      </div>
      <div class="scan-progress" id="scanProgress" role="progressbar" aria-label="Scan-Fortschritt" aria-valuemin="0" aria-valuemax="100" hidden><div></div></div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <section class="view" id="view-overview" data-view="overview" aria-labelledby="h-overview"></section>
      <section class="view" id="view-findings" data-view="findings" aria-labelledby="h-findings" hidden></section>
      <section class="view" id="view-integrity" data-view="integrity" aria-labelledby="h-integrity" hidden></section>
      <section class="view" id="view-recommendations" data-view="recommendations" aria-labelledby="h-recommendations" hidden></section>
      <section class="view" id="view-history" data-view="history" aria-labelledby="h-history" hidden></section>
      <section class="view" id="view-audit" data-view="audit" aria-labelledby="h-audit" hidden></section>
      <section class="view" id="view-settings" data-view="settings" aria-labelledby="h-settings" hidden></section>
    </main>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawerTitle" hidden tabindex="-1"></aside>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="announcer" aria-live="assertive"></div>

<script src="app.js?v=__VERSION__"></script>
</body>
</html>
