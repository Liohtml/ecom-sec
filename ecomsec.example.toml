# Beispielkonfiguration für ecomsec. Kopieren nach ./ecomsec.toml oder per --config angeben.

[target]
# auto | jtl5 | shopware6 | woocommerce | magento2 | shopify
platform = "auto"
root = "/var/www/shop"

[scan]
# Dateien ab diesem Datum gelten als neu/geändert (Standard: 17.06.2026, CVE-2026-54390)
reference_date = "2026-06-17"
# Zeitbudget für den Dateiscan; danach Checkpoint und Fortsetzung beim nächsten Lauf
# time_budget = "45s"
# Relative Verzeichnisse, die der Dateiscan überspringt
exclude = []
# Zusätzliche Regelverzeichnisse (*.toml)
rule_dirs = []
# Maximale Dateigröße für die Inhaltsprüfung (Bytes)
# max_file_size = 8388608
# Composer-Pakete bei jedem Scan gegen OSV.dev prüfen (sendet Paketname + Version)
online = false
# Zusätzliche Advisory-Verzeichnisse (*.toml); heruntergeladene (advisories update) werden immer geladen
advisory_dirs = []

[shopify]
# shop = "my-store.myshopify.com"
# Token aus Umgebungsvariable lesen (empfohlen) …
token_env = "SHOPIFY_ACCESS_TOKEN"
# … oder direkt (nicht empfohlen)
# token = "shpat_..."
api_version = "2025-07"
# Zusätzlich vertrauenswürdige Hosts für Script-Tags, Webhooks und Theme-Skripte
allow_hosts = []
# Obergrenze geladener Theme-Dateien
max_assets = 150

[state]
# dir = "/var/lib/ecomsec"

[serve]
bind = "127.0.0.1:8787"
# token = "geheim"

# ---------------------------------------------------------------------------
# Tägliche Überwachung (`ecomsec watch`) – siehe docs/MONITORING.md
# ---------------------------------------------------------------------------

[watch]
# Vor jedem Lauf die Advisory-Datenbank aktualisieren (Netzwerkfehler werden toleriert)
update_advisories = true
# update_url = "https://raw.githubusercontent.com/liohtml/ecom-sec/main/advisories"
# Dauerbetrieb ohne cron/systemd: `ecomsec watch` prüft dann in diesem Abstand
# interval = "24h"

[notify]
# Wann benachrichtigt wird: critical | warning | any | always
on = "warning"
# Präfix für Betreff und Titel
subject_prefix = "[ecomsec]"
# Link zum Dashboard in den Nachrichten (optional)
# dashboard_url = "https://shop.example.de/ecomsec/"

# Pro Kanal ein [[notify.channel]]-Block. Geheimnisse bitte per *_env aus
# Umgebungsvariablen lesen statt sie hier einzutragen.

# [[notify.channel]]
# kind = "email"
# name = "Inhaber"
# smtp_host = "smtp.example.de"
# smtp_port = 587                 # Standard: 587 (starttls), 465 (tls), 25 (none)
# smtp_security = "starttls"      # starttls | tls | none
# smtp_user = "shop@example.de"   # oder smtp_user_env = "ECOMSEC_SMTP_USER"
# smtp_password_env = "ECOMSEC_SMTP_PASSWORD"
# from = "ecomsec <shop@example.de>"
# to = ["inhaber@example.de"]

# [[notify.channel]]
# kind = "slack"                  # slack | teams | teams-legacy | discord | mattermost | webhook
# url_env = "ECOMSEC_SLACK_WEBHOOK"
# on = "critical"                 # optional: eigene Schwelle für diesen Kanal

# [[notify.channel]]
# kind = "ntfy"
# url = "https://ntfy.sh"         # oder eigener Server
# topic = "shop-7f3a9c2e"         # schwer zu erratender Name
# token_env = "ECOMSEC_NTFY_TOKEN" # optional

# [[notify.channel]]
# kind = "telegram"
# token_env = "ECOMSEC_TELEGRAM_TOKEN"
# chat_id = "123456789"

# [[notify.channel]]
# kind = "webhook"
# url_env = "ECOMSEC_WEBHOOK_URL"
# header_env = { "Authorization" = "ECOMSEC_WEBHOOK_AUTH" }

# [[notify.channel]]
# kind = "file"                   # oder "stdout"
# path = "/var/log/ecomsec/aenderungen.log"
# format = "text"                 # text | json (eine Zeile pro Meldung)
[audit]
# Optionales KI-Audit (`ecomsec audit`), siehe docs/AUDIT.md. Überträgt nur redigierte
# Ausschnitte an die Anthropic-API. Der Schlüssel steht nie in dieser Datei, nur der Name
# der Umgebungsvariable, die ihn enthält:
api_key_env = "ANTHROPIC_API_KEY"
# claude-sonnet-5-5 (Standard, günstig) oder claude-opus-5-5 (gründlicher, ca. doppelte Kosten)
model = "claude-sonnet-5-5"
# triage = Befunde bewerten · hunt = zusätzlich eigenen Code (Plugins, Templates) prüfen
mode = "triage"
# Denktiefe: low | medium | high | xhigh | max
effort = "medium"
# Harte Grenzen pro Lauf (Standard: 40 Runden / 1,5 Mio. Tokens, im Hunt-Modus 80 / 4 Mio.)
# max_turns = 40
# max_tokens_budget = 1500000
# Hunt-Modus: Anzahl und Gesamtgröße der vorausgewählten Code-Dateien
# hunt_max_files = 40
# hunt_max_bytes = 819200
# Serverseitiges Ausweichmodell, falls eine Anfrage von den Sicherheitsfiltern abgelehnt wird
fallback = true
# Nur für Proxys/Gateways ändern
# api_base = "https://api.anthropic.com"
